name: RG exact run41686621300 final family callback
# Install only on default main after publishing the fixed reviewed task commit.
# No numeric certificates are recompiled; all successful origins stay sealed.
# Manual replay accepts no inputs and requires the same completed master.
on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["RG bounded original D1 numeric reconstruction and automatic family join"]
    types: [completed]
    branches: [rg-degree-one-large-20261103]
permissions:
  contents: read
  actions: read
concurrency:
  group: rg-degree-one-large-final-41686621300
  cancel-in-progress: false
jobs:
  check:
    if: >-
      github.repository == 'RhudeJJJJ/formal-conjectures' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_run' &&
      github.event.action == 'completed' &&
      github.event.workflow_run.id == 41686621300 &&
      github.event.workflow_run.run_attempt == 1 &&
      github.event.workflow_run.head_sha == 'aaeaec3cec22467d3f0b83b1761bfb40087bb991' &&
      github.event.workflow_run.head_branch == 'rg-degree-one-large-20261103' &&
      github.event.workflow_run.path == '.github/workflows/rg-d1-numeric-and-final-20261103.yml') ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      RG_FINAL_CONTINUATION_DESCRIPTOR: '{"kind":"SEALED_EXACT_NUMERIC_RUN_FINAL_CALLBACK","repository":"RhudeJJJJ/formal-conjectures","numeric_run":41686621300,"numeric_source_commit":"aaeaec3cec22467d3f0b83b1761bfb40087bb991","numeric_workflow_path":".github/workflows/rg-d1-numeric-and-final-20261103.yml","numeric_branch":"rg-degree-one-large-20261103","numeric_run_attempt":1,"callback_default_branch":"main","proof_source_commit":"4630fed75fe0821140877b43efc223d85b501a6c","bound_files":{"ci/rg_d1_required_numeric_batches_20261103.json":"f47334108b563ae5e20f15fc07b2e4589f6d6e7f49e308bfdb8b4301e689e18e","ci/rg_d1_numeric_run41686621300_20261103.json":"9e4fbdfaf1f57b59453b5501e270e4d15b87a06bddcafd719ac882bd026980c7","ci/rg_d1_20261103_verified_continuation_contract.json":"b4e83fa01244630771b7bddf9c78180885cb933e4a4e4d698694bc8ed91f1367","ci/rg_d1_20261103_verified_numeric_replacements.json":"72c52956c9c6f77228317ba623851953ca3151a3ae7ded9d929ac1251899049d","ci/rg_current_final_source_binding_20261103.json":"60e4aa538e6b6755fb2057f7a772fdb336d3054b9f5d5243a03317177d90797c"}}'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 4630fed75fe0821140877b43efc223d85b501a6c
          persist-credentials: false
      - name: Require the exact callback event, reviewed checkout and sealed input hashes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B ci/rg_final_continuation_context.py
      - name: Reserve actual host space without touching proof inputs
        run: python3 -B ci/rg_prepare_finite_runner_storage.py --required-free-gib 45
      - name: Reproduce the already checked shared class sources
        run: |
          python3 -B ci/rg_numeric137_decomposed_recovery.py --spec-sha256 215ae3b2b69a4d7f9f00d694228a45333df0b73e588a6b2f0f61c97b45db4302 --phase materialize
          python3 -B ci/rg_numeric166_decomposed_recovery.py --spec-sha256 0ddb0d67758c7627ddc7fae947a7100bcb94c9ea6b26ab3f9c13fef33f7d8f8c --phase materialize
          python3 -B ci/rg_materialize_compact_closed_families.py --endpoint Proofs.RadenkovicGutmanCompactFiniteOriginalSmallGeFour --max-raw-mib 512
          python3 -B ci/rg_materialize_compact_closed_families.py --endpoint Proofs.RadenkovicGutmanCompactFiniteOriginalDegreeOneSmall --max-raw-mib 512
          python3 - <<'PY'
          import json, subprocess, sys
          plan = json.load(open('ci/rg_shared_arm_materialization_plan.json'))
          for index in plan['classes']['30']['open_chunk_indices']:
              subprocess.run([sys.executable, '-B', 'ci/rg_materialize_shared_arm.py',
                              '--tag', '30', '--chunk', str(index)], check=True)
          PY
      - name: Collect exact successful numeric and named prerequisite exports
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B ci/rg_collect_exact_d1_reproductions.py --spec ci/rg_d1_required_numeric_batches_20261103.json --external-contract ci/rg_d1_20261103_verified_continuation_contract.json --numeric-origin ci/rg_d1_numeric_run41686621300_20261103.json --numeric-replacements ci/rg_d1_20261103_verified_numeric_replacements.json --current-source-binding ci/rg_current_final_source_binding_20261103.json --output ci/rg_d1_20261103_runtime_reconstructed_exports --external-wait-seconds 0
      - name: Establish exact current closure and available original object coverage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -B ci/rg_plan_final_numeric_join.py \
            --current-source-binding ci/rg_current_final_source_binding_20261103.json \
            --output Proofs/RG_Lean_20261019/build/exact_degree_one_plan.json
      - name: Install the fixed project toolchain
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Materialize the fixed dependency lock
        run: python3 -B ci/rg_dependencies.py
      - name: Fetch only the external modules of this exact source closure
        run: |
          python3 - <<'PY'
          import json, pathlib, re, subprocess, sys
          root = pathlib.Path('Proofs/RG_Lean_20261019')
          sys.path.insert(0, str(root))
          from verify import without_comments
          plan = json.loads((root / 'build/exact_degree_one_plan.json').read_bytes())
          external = set()
          for name in plan['source_sha256']:
              base = root / 'ThirdParty/LeanCert' if name.startswith('LeanCert.') else root
              text = without_comments((base / (name.replace('.', '/') + '.lean')).read_text())
              for dep in re.findall(r'^\s*(?:public\s+)?import\s+([\w.]+)\s*$', text, re.M):
                  if not dep.startswith(('Proofs.', 'LeanCert.', 'Lean.', 'Init.', 'Std.')) and dep not in ('Lean', 'Init', 'Std'):
                      external.add(dep)
          subprocess.run(['lake', 'exe', 'cache', 'get', *sorted(external)], check=True)
          PY
      - name: Install the transparent filesystem utility
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y btrfs-progs
      - name: Create a new bounded logical proofstore without formatting an existing disk
        run: python3 -B ci/rg_ephemeral_compressed_proofstore.py --logical-gib 256
      - name: Authenticate and read back every selected original object and sidecar
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -B ci/rg_restore_exact_compressed_plan.py \
            --plan Proofs/RG_Lean_20261019/build/exact_degree_one_plan.json \
            --build-directory Proofs/RG_Lean_20261019/build/extension
      - name: Enforce exactly the two historical long-class heads
        run: python3 -B ci/rg_original_d1_numeric_reproduction.py --plan ci/rg_d1_required_numeric_batches_20261103/long_heads.json --phase preflight
      - name: Reconstruct the two original long-class heads
        shell: bash
        run: |
          set -o pipefail
          python3 -B ci/rg_run_with_host_reserve.py -- \
            python3 -B ci/rg_run_original_d1_numeric.py --plan ci/rg_d1_required_numeric_batches_20261103/long_heads.json --phase kernel | python3 -B ci/rg_compact_ci_output.py
      - name: Require exact historical identities for both long-class heads
        run: python3 -B ci/rg_original_d1_numeric_reproduction.py --plan ci/rg_d1_required_numeric_batches_20261103/long_heads.json --phase compare
      - name: Preserve the separate historical-head receipt and resource observation
        run: |
          cp Proofs/RG_Lean_20261019/build/extension/receipt.json Proofs/RG_Lean_20261019/build/original_long_heads_receipt.json
          cp Proofs/RG_Lean_20261019/build/fresh_exports/resource_observer.json Proofs/RG_Lean_20261019/build/original_long_heads_resource_observer.json
      - name: Recompute and enforce both intervals and the three-module final frontier
        run: |
          python3 -B ci/rg_restore_with_kernel_fallback.py \
            --plan ci/rg_empty_restore_plan.json \
            --build-directory Proofs/RG_Lean_20261019/build/extension \
            --endpoint Proofs.RadenkovicGutmanRemainingThreeAssembly \
            --max-fresh 5 --preflight-only
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('Proofs/RG_Lean_20261019/build')
          planned = json.loads((root / 'exact_degree_one_plan.json').read_bytes())
          actual = json.loads((root / 'extension/bounded_kernel_fallback_plan.json').read_bytes())
          heads = {'Proofs.RadenkovicGutmanD1Long10', 'Proofs.RadenkovicGutmanD1Long30'}
          assert set(actual['fresh_modules']) == set(planned['fresh_modules']) - heads
          assert actual['required_modules'] == planned['required_modules']
          assert set(actual['fresh_modules']) == set(planned['fresh_allowlist']) - heads
          assert set(actual['fresh_modules']) == {'Proofs.RadenkovicGutmanD1OriginalSharedSlice0080Complete', 'Proofs.RadenkovicGutmanD1OriginalSharedSlice0098Complete', 'Proofs.RadenkovicGutmanD1OriginalSharedBothLong', 'Proofs.RadenkovicGutmanOriginalDegreeOneLarge', 'Proofs.RadenkovicGutmanRemainingThreeAssembly'}
          PY
      - name: Check both affected intervals, final class, full family, and three-field assembly
        shell: bash
        run: |
          set -o pipefail
          python3 -B ci/rg_run_with_host_reserve.py -- \
            python3 -B ci/rg_observed_kernel_verify.py --memory-reserve-mib 2048 -- \
            --mathlib-project "$GITHUB_WORKSPACE" \
            --endpoint Proofs.RadenkovicGutmanRemainingThreeAssembly \
            --workers 1 --module-timeout 900 --resume | python3 -B ci/rg_compact_ci_output.py
      - name: Require the exact completed kernel milestone and remaining three scopes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B ci/rg_verify_degree_one_large_milestone.py
      - name: Retain complete fresh outputs, axiom profiles, and diagnostics
        if: always()
        run: |
          python3 -B ci/rg_collect_fresh_exports.py \
            --build-directory Proofs/RG_Lean_20261019/build/extension \
            --output-directory Proofs/RG_Lean_20261019/build/fresh_exports
      - name: Preserve complete fresh proof exports in the standard archive layout
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rg-degree-one-large-exact-hook-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: Proofs/RG_Lean_20261019/build/fresh_exports
          retention-days: 90
      - name: Preserve original evidence and measured resource results separately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rg-degree-one-large-exact-hook-final-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Proofs/RG_Lean_20261019/build/final_continuation_context.json
            Proofs/RG_Lean_20261019/build/exact_degree_one_plan.json
            Proofs/RG_Lean_20261019/build/degree_one_large_verified_milestone.json
            Proofs/RG_Lean_20261019/build/original_long_heads_receipt.json
            Proofs/RG_Lean_20261019/build/original_long_heads_resource_observer.json
            Proofs/RG_Lean_20261019/build/extension/bounded_kernel_fallback_plan.json
            ci/rg_d1_20261103_runtime_reconstructed_exports
            rg-proofstore-setup.json
            rg-proofstore-roundtrip-reports
            rg-proofstore-kernel-reserve.json
          retention-days: 90

