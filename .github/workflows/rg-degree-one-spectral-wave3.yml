permissions:
  contents: read
  actions: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        endpoint: [Proofs.RadenkovicGutmanDegreeOneSmallSpectraBatch22,Proofs.RadenkovicGutmanDegreeOneSmallSpectraBatch23,Proofs.RadenkovicGutmanDegreeOneSmallSpectraBatch24,Proofs.RadenkovicGutmanDegreeOneSmallSpectraBatch25,Proofs.RadenkovicGutmanDegreeOneSmallSpectraBatch26,Proofs.RadenkovicGutmanDegreeOneSmallSpectraBatch27,Proofs.RadenkovicGutmanDegreeOneSmallSpectraBatch28,Proofs.RadenkovicGutmanDegreeOneSmallSpectraBatch29,Proofs.RadenkovicGutmanDegreeOneSmallSpectraBatch30,Proofs.RadenkovicGutmanDegreeOneSmallSpectraBatch31,Proofs.RadenkovicGutmanDegreeOneSmallSpectraBatch32,Proofs.RadenkovicGutmanDegreeOneSmallSpectraBatch33,Proofs.RadenkovicGutmanDegreeOneSmallSpectraBatch34,Proofs.RadenkovicGutmanDegreeOneSmallSpectraBatch35,Proofs.RadenkovicGutmanDegreeOneSmallSpectraBatch36,Proofs.RadenkovicGutmanDegreeOneSmallSpectraBatch37,Proofs.RadenkovicGutmanDegreeOneSmallSpectraBatch38,Proofs.RadenkovicGutmanDegreeOneSmallSpectraBatch39,Proofs.RadenkovicGutmanDegreeOneSmallSpectraBatch40]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install the project toolchain
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Materialize the exact dependency lock
        run: python3 -B ci/rg_dependencies.py
      - name: Fetch the required Mathlib cache
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess
          root = pathlib.Path('Proofs/RG_Lean_20261019')
          seen, external = set(), set()
          def visit(name):
              if name in seen:
                  return
              seen.add(name)
              source = (root / (name.replace('.', '/') + '.lean')).read_text()
              for dep in re.findall(r'^\s*import\s+([\w.]+)', source, re.M):
                  if dep.startswith('Proofs.'):
                      visit(dep)
                  else:
                      external.add(dep)
          visit('${{ matrix.endpoint }}')
          subprocess.run(['lake', 'exe', 'cache', 'get', *sorted(external)], check=True)
          PY
      - name: Restore exact source-bound prerequisites
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -B ci/rg_restore_job_exports.py --manifest ci/rg_degree_one_spectral_wave3_scope000_prior_exports.json --build-directory Proofs/RG_Lean_20261019/build/extension
          python3 -B ci/rg_restore_job_exports.py --manifest ci/rg_degree_one_spectral_wave3_scope001_prior_exports.json --build-directory Proofs/RG_Lean_20261019/build/extension
      - name: Check multiplicities and actual graph spectral comparison
        run: python3 -B Proofs/RG_Lean_20261019/verify_extension.py --mathlib-project "$GITHUB_WORKSPACE" --endpoint ${{ matrix.endpoint }} --workers 1 --module-timeout 600 --resume --print-receipt
      - name: Retain completed records and diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib,shutil
          root=pathlib.Path('Proofs/RG_Lean_20261019/build/extension')
          records=[json.loads(p.read_text()) for p in sorted(root.glob('Proofs.*.json'))]
          print('PARTIAL_RECORDS_JSON '+json.dumps({'modules':records},separators=(',',':')))
          fresh=root.parent/'fresh_exports';fresh.mkdir(parents=True,exist_ok=True)
          for row in records:
              if row['mode']=='FRESH_KERNEL_EXPORT':
                  name=row['module'];rel=name.replace('.','/')+'.olean';dest=fresh/rel
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(root/rel,dest);shutil.copyfile(root/(name+'.json'),fresh/(name+'.json'))
          for log in root.glob('Proofs.*.log'):
              shutil.copyfile(log,fresh/log.name);print('MODULE_LOG_TAIL '+log.name+' '+log.read_text()[-18000:])
          PY
      - name: Retain new exports only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rg-degree-one-spectral-wave3-exports-${{ github.run_id }}-${{ strategy.job-index }}
          path: Proofs/RG_Lean_20261019/build/fresh_exports
          retention-days: 7
