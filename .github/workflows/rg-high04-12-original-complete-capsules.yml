name: RG preserve all 81 original higher class kernel scopes

on:
  push:
    branches: [rg-remaining-six-spectral-20261021]
    paths: ['.github/workflows/rg-high04-12-original-complete-capsules.yml']

permissions:
  contents: read
  actions: read

jobs:
  check:
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        include:
          - endpoint: Proofs.RadenkovicGutmanHigh04To12OriginalCapsule000
            plan: ci/rg_high04_12_complete_capsule000_restore_plan.json
          - endpoint: Proofs.RadenkovicGutmanHigh04To12OriginalCapsule001
            plan: ci/rg_high04_12_complete_capsule001_restore_plan.json
          - endpoint: Proofs.RadenkovicGutmanHigh04To12OriginalCapsule002
            plan: ci/rg_high04_12_complete_capsule002_restore_plan.json
          - endpoint: Proofs.RadenkovicGutmanHigh04To12OriginalCapsule003
            plan: ci/rg_high04_12_complete_capsule003_restore_plan.json
          - endpoint: Proofs.RadenkovicGutmanHigh04To12OriginalCapsule004
            plan: ci/rg_high04_12_complete_capsule004_restore_plan.json
          - endpoint: Proofs.RadenkovicGutmanHigh04To12OriginalCapsule005
            plan: ci/rg_high04_12_complete_capsule005_restore_plan.json
          - endpoint: Proofs.RadenkovicGutmanHigh04To12OriginalCapsule006
            plan: ci/rg_high04_12_complete_capsule006_restore_plan.json
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install the project toolchain
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Materialize the exact dependency lock
        run: python3 -B ci/rg_dependencies.py
      - name: Fetch the required Mathlib cache
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess
          root = pathlib.Path('Proofs/RG_Lean_20261019')
          seen, external = set(), set()
          def visit(name):
              if name in seen:
                  return
              seen.add(name)
              source = (root / (name.replace('.', '/') + '.lean')).read_text()
              for dep in re.findall(r'^\s*import\s+([\w.]+)', source, re.M):
                  if dep.startswith('Proofs.'):
                      visit(dep)
                  elif not dep.startswith(('Lean.', 'Init.', 'Std.')) and dep not in ('Lean','Init','Std'):
                      external.add(dep)
          visit('${{ matrix.endpoint }}')
          subprocess.run(['lake', 'exe', 'cache', 'get', *sorted(external)], check=True)
          PY
      - name: Restore one independently audited complete source-bound base scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B ci/rg_restore_complete_scope.py --manifest ci/rg_reusable_analytic_kernel_base_complete_scope_capsule.json --build-directory Proofs/RG_Lean_20261019/build/extension
      - name: Restore every source-bound original class object
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B ci/rg_restore_plan_parallel.py --plan ${{ matrix.plan }} --build-directory Proofs/RG_Lean_20261019/build/extension --workers 2
      - name: Require one fresh packaging module without new mathematical coverage
        run: python3 -B ci/rg_restore_with_kernel_fallback.py --plan ${{ matrix.plan }} --build-directory Proofs/RG_Lean_20261019/build/extension --endpoint ${{ matrix.endpoint }} --max-fresh 1 --preflight-only
      - name: Check multiplicities and actual graph spectral comparison
        shell: bash
        run: |
          set -o pipefail
          python3 -B Proofs/RG_Lean_20261019/verify_extension.py --mathlib-project "$GITHUB_WORKSPACE" --endpoint ${{ matrix.endpoint }} --workers 1 --module-timeout 600 --resume | python3 -B ci/rg_compact_ci_output.py
      - name: Retain completed records and diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib,shutil
          root=pathlib.Path('Proofs/RG_Lean_20261019/build/extension')
          records=[json.loads(p.read_text()) for p in sorted(root.glob('Proofs.*.json'))]
          fresh=root.parent/'fresh_exports';fresh.mkdir(parents=True,exist_ok=True)
          (fresh/'diagnostics_records.json').write_text(json.dumps({'modules':records},separators=(',',':'))+'\n')
          if (root/'receipt.json').is_file():shutil.copyfile(root/'receipt.json',fresh/'receipt.json')
          print('RETAINED_RECORD_COUNTS '+json.dumps({'total':len(records),'fresh':sum(r['mode']=='FRESH_KERNEL_EXPORT' for r in records)}))
          for row in records:
              if row['mode']=='FRESH_KERNEL_EXPORT':
                  name=row['module'];rel=name.replace('.','/')+'.olean';dest=fresh/rel
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(root/rel,dest);shutil.copyfile(root/(name+'.json'),fresh/(name+'.json'))
          for log in root.glob('Proofs.*.log'):
              shutil.copyfile(log,fresh/log.name);print('MODULE_LOG_TAIL '+log.name+' '+log.read_text()[-18000:])
          PY
      - name: Export every required object with unchanged original origins
        if: success()
        run: |
          python3 - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path('Proofs/RG_Lean_20261019/build/extension/receipt.json').read_text())
          assert all(not row.get('additional_outputs') for row in r['modules'].values())
          PY
          python3 -B ci/rg_export_complete_scope.py --build-directory Proofs/RG_Lean_20261019/build/extension --output Proofs/RG_Lean_20261019/build/full_capsule
      - name: Retain new exports only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rg-high04-12-original-complete-capsules-exports-${{ github.run_id }}-${{ strategy.job-index }}
          path: Proofs/RG_Lean_20261019/build/full_capsule
          retention-days: 90

