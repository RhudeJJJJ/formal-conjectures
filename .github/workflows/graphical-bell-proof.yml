name: Graphical Bell exact proof development
on:
  push:
    branches: [proof-graphical-bell-20261025]
    paths: [".github/workflows/graphical-bell-proof.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pinned Lean
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Get pinned Mathlib cache
        run: lake exe cache get
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .lake/build
          key: bell-imports-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            bell-imports-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            wowii361362-imports-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Build exact original statement module
        run: lake --wfail build FormalConjectures.Other.GraphicalBell
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .lake/build
          key: bell-imports-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
      - name: Bounded exact-source certificate check
        env:
          PROOF_LOG_TOKEN: ${{ github.token }}
        run: |
          cp Proofs/GraphicalBell/ci_loop.py /tmp/graphical-bell-ci-loop.py
          python3 /tmp/graphical-bell-ci-loop.py
