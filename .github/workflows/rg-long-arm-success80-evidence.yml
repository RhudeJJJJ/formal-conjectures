name: RG long arm 80 completed proof scopes
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
jobs:
  collect:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        part: ['000','001','002','003']
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify original archive and object bytes without recompiling mathematics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B ci/rg_collect_verified_evidence.py --plan ci/rg_long_arm_success80_evidence_plan${{ matrix.part }}.json --output build/rg_long_arm_success80_evidence
      - name: Preserve full receipts, logs and verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rg-long-arm-success80-evidence-${{ github.run_id }}-${{ matrix.part }}
          path: build/rg_long_arm_success80_evidence
          retention-days: 7
