  final:
    name: ge46-checked-final
    needs: [representative, evaluation, rows]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
