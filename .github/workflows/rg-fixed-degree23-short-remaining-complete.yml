name: RG complete original remaining short degree 2 and 3 classes

on:
  push:
    branches: [rg-remaining-six-spectral-20261021]
    paths: ['.github/workflows/rg-fixed-degree23-short-remaining-complete.yml']

permissions:
  contents: read
  actions: read

jobs:
  check:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        endpoint: [Proofs.RadenkovicGutmanFixedDegree02Class33Batch000,Proofs.RadenkovicGutmanFixedDegree02Class33Batch001,Proofs.RadenkovicGutmanFixedDegree02Class33Batch002,Proofs.RadenkovicGutmanFixedDegree02Class14,Proofs.RadenkovicGutmanFixedDegree02Class22,Proofs.RadenkovicGutmanFixedDegree02Class13,Proofs.RadenkovicGutmanFixedDegree02Class23,Proofs.RadenkovicGutmanFixedDegree02Class24,Proofs.RadenkovicGutmanFixedDegree02Class34,Proofs.RadenkovicGutmanFixedDegree02Class44,Proofs.RadenkovicGutmanFixedDegree03Class14,Proofs.RadenkovicGutmanFixedDegree03Class13,Proofs.RadenkovicGutmanFixedDegree03Class23,Proofs.RadenkovicGutmanFixedDegree03Class22,Proofs.RadenkovicGutmanFixedDegree03Class24,Proofs.RadenkovicGutmanFixedDegree03Class33,Proofs.RadenkovicGutmanFixedDegree03Class34,Proofs.RadenkovicGutmanFixedDegree03Class44]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install the project toolchain
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Materialize the exact dependency lock
        run: python3 -B ci/rg_dependencies.py
      - name: Fetch the required Mathlib cache
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess
          root = pathlib.Path('Proofs/RG_Lean_20261019')
          seen, external = set(), set()
          def visit(name):
              if name in seen:
                  return
              seen.add(name)
              source = (root / (name.replace('.', '/') + '.lean')).read_text()
              for dep in re.findall(r'^\s*import\s+([\w.]+)', source, re.M):
                  if dep.startswith('Proofs.'):
                      visit(dep)
                  elif not dep.startswith(('Lean.', 'Init.', 'Std.')) and dep not in ('Lean','Init','Std'):
                      external.add(dep)
          visit('${{ matrix.endpoint }}')
          subprocess.run(['lake', 'exe', 'cache', 'get', *sorted(external)], check=True)
          PY
      - name: Restore one independently audited complete source-bound base scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B ci/rg_restore_complete_scope.py --manifest ci/rg_mean_horner_kernel_base_complete_scope_capsule.json --build-directory Proofs/RG_Lean_20261019/build/extension
      - name: Restore all three proved generic class integral modules
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B ci/rg_restore_job_exports.py --manifest ci/rg_fixed_class_kernel_base_original_prior_exports.json --build-directory Proofs/RG_Lean_20261019/build/extension
      - name: Require the bounded complete class frontier
        run: python3 -B ci/rg_restore_with_kernel_fallback.py --plan ci/rg_fixed_degree23_short_remaining_complete_restore_plan.json --build-directory Proofs/RG_Lean_20261019/build/extension --endpoint ${{ matrix.endpoint }} --max-fresh 512 --preflight-only
      - name: Check multiplicities and actual graph spectral comparison
        shell: bash
        run: |
          set -o pipefail
          python3 -B Proofs/RG_Lean_20261019/verify_extension.py --mathlib-project "$GITHUB_WORKSPACE" --endpoint ${{ matrix.endpoint }} --workers 1 --module-timeout 600 --resume | python3 -B ci/rg_compact_ci_output.py
      - name: Retain completed records and diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib,shutil
          root=pathlib.Path('Proofs/RG_Lean_20261019/build/extension')
          records=[json.loads(p.read_text()) for p in sorted(root.glob('Proofs.*.json'))]
          fresh=root.parent/'fresh_exports';fresh.mkdir(parents=True,exist_ok=True)
          (fresh/'diagnostics_records.json').write_text(json.dumps({'modules':records},separators=(',',':'))+'\n')
          if (root/'receipt.json').is_file():shutil.copyfile(root/'receipt.json',fresh/'receipt.json')
          print('RETAINED_RECORD_COUNTS '+json.dumps({'total':len(records),'fresh':sum(r['mode']=='FRESH_KERNEL_EXPORT' for r in records)}))
          for row in records:
              if row['mode']=='FRESH_KERNEL_EXPORT':
                  name=row['module'];rel=name.replace('.','/')+'.olean';dest=fresh/rel
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(root/rel,dest);shutil.copyfile(root/(name+'.json'),fresh/(name+'.json'))
          for log in root.glob('Proofs.*.log'):
              shutil.copyfile(log,fresh/log.name);print('MODULE_LOG_TAIL '+log.name+' '+log.read_text()[-18000:])
          PY
      - name: Retain new exports only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rg-fixed-degree23-short-remaining-complete-exports-${{ github.run_id }}-${{ strategy.job-index }}
          path: Proofs/RG_Lean_20261019/build/fresh_exports
          retention-days: 30

# The largest class retains all 486 cells. Its first three batches are checked
# separately so the final whole-class frontier can remain below 512 modules.
