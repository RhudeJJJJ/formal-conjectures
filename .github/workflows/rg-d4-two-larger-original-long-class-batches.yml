name: RG d4 two larger original long class batches

on:
  push:
    branches: [rg-remaining-six-spectral-20261021]
    paths: ['.github/workflows/rg-d4-two-larger-original-long-class-batches.yml']

permissions:
  contents: read
  actions: read

jobs:
  check:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        endpoint: [Proofs.RadenkovicGutmanFixedDegree04Class10Batch000,Proofs.RadenkovicGutmanFixedDegree04Class10Batch001,Proofs.RadenkovicGutmanFixedDegree04Class10Batch002,Proofs.RadenkovicGutmanFixedDegree04Class10Batch003,Proofs.RadenkovicGutmanFixedDegree04Class10Batch004,Proofs.RadenkovicGutmanFixedDegree04Class10Batch005,Proofs.RadenkovicGutmanFixedDegree04Class10Batch006,Proofs.RadenkovicGutmanFixedDegree04Class10Batch007,Proofs.RadenkovicGutmanFixedDegree04Class10Batch008,Proofs.RadenkovicGutmanFixedDegree04Class10Batch009,Proofs.RadenkovicGutmanFixedDegree04Class30Batch000,Proofs.RadenkovicGutmanFixedDegree04Class30Batch001,Proofs.RadenkovicGutmanFixedDegree04Class30Batch002,Proofs.RadenkovicGutmanFixedDegree04Class30Batch003,Proofs.RadenkovicGutmanFixedDegree04Class30Batch004,Proofs.RadenkovicGutmanFixedDegree04Class30Batch005,Proofs.RadenkovicGutmanFixedDegree04Class30Batch006,Proofs.RadenkovicGutmanFixedDegree04Class30Batch007,Proofs.RadenkovicGutmanFixedDegree04Class30Batch008,Proofs.RadenkovicGutmanFixedDegree04Class30Batch009,Proofs.RadenkovicGutmanFixedDegree04Class30Batch010,Proofs.RadenkovicGutmanFixedDegree04Class30Batch011,Proofs.RadenkovicGutmanFixedDegree04Class30Batch012,Proofs.RadenkovicGutmanFixedDegree04Class30Batch013,Proofs.RadenkovicGutmanFixedDegree04Class30Batch014,Proofs.RadenkovicGutmanFixedDegree04Class30Batch015,Proofs.RadenkovicGutmanFixedDegree04Class30Batch016,Proofs.RadenkovicGutmanFixedDegree04Class30Batch017,Proofs.RadenkovicGutmanFixedDegree04Class30Batch018,Proofs.RadenkovicGutmanFixedDegree04Class30Batch019,Proofs.RadenkovicGutmanFixedDegree04Class30Batch020,Proofs.RadenkovicGutmanFixedDegree04Class30Batch021,Proofs.RadenkovicGutmanFixedDegree04Class30Batch022,Proofs.RadenkovicGutmanFixedDegree04Class30Batch023,Proofs.RadenkovicGutmanFixedDegree04Class30Batch024,Proofs.RadenkovicGutmanFixedDegree04Class30Batch025,Proofs.RadenkovicGutmanFixedDegree04Class30Batch026,Proofs.RadenkovicGutmanFixedDegree04Class30Batch027,Proofs.RadenkovicGutmanFixedDegree04Class30Batch028,Proofs.RadenkovicGutmanFixedDegree04Class30Batch029,Proofs.RadenkovicGutmanFixedDegree04Class30Batch030,Proofs.RadenkovicGutmanFixedDegree04Class30Batch031,Proofs.RadenkovicGutmanFixedDegree04Class30Batch032,Proofs.RadenkovicGutmanFixedDegree04Class30Batch033]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install the project toolchain
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Materialize the exact dependency lock
        run: python3 -B ci/rg_dependencies.py
      - name: Fetch the required Mathlib cache
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess
          root = pathlib.Path('Proofs/RG_Lean_20261019')
          seen, external = set(), set()
          def visit(name):
              if name in seen:
                  return
              seen.add(name)
              source = (root / (name.replace('.', '/') + '.lean')).read_text()
              for dep in re.findall(r'^\s*import\s+([\w.]+)', source, re.M):
                  if dep.startswith('Proofs.'):
                      visit(dep)
                  elif not dep.startswith(('Lean.', 'Init.', 'Std.')) and dep not in ('Lean','Init','Std'):
                      external.add(dep)
          visit('${{ matrix.endpoint }}')
          subprocess.run(['lake', 'exe', 'cache', 'get', *sorted(external)], check=True)
          PY
      - name: Restore one independently audited complete source-bound base scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B ci/rg_restore_complete_scope.py --manifest ci/rg_reusable_analytic_kernel_base_complete_scope_capsule.json --build-directory Proofs/RG_Lean_20261019/build/extension
      - name: Check multiplicities and actual graph spectral comparison
        shell: bash
        run: |
          set -o pipefail
          python3 -B Proofs/RG_Lean_20261019/verify_extension.py --mathlib-project "$GITHUB_WORKSPACE" --endpoint ${{ matrix.endpoint }} --workers 1 --module-timeout 600 --resume | python3 -B ci/rg_compact_ci_output.py
      - name: Retain completed records and diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib,shutil
          root=pathlib.Path('Proofs/RG_Lean_20261019/build/extension')
          records=[json.loads(p.read_text()) for p in sorted(root.glob('Proofs.*.json'))]
          fresh=root.parent/'fresh_exports';fresh.mkdir(parents=True,exist_ok=True)
          (fresh/'diagnostics_records.json').write_text(json.dumps({'modules':records},separators=(',',':'))+'\n')
          if (root/'receipt.json').is_file():shutil.copyfile(root/'receipt.json',fresh/'receipt.json')
          print('RETAINED_RECORD_COUNTS '+json.dumps({'total':len(records),'fresh':sum(r['mode']=='FRESH_KERNEL_EXPORT' for r in records)}))
          for row in records:
              if row['mode']=='FRESH_KERNEL_EXPORT':
                  name=row['module'];rel=name.replace('.','/')+'.olean';dest=fresh/rel
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(root/rel,dest);shutil.copyfile(root/(name+'.json'),fresh/(name+'.json'))
          for log in root.glob('Proofs.*.log'):
              shutil.copyfile(log,fresh/log.name);print('MODULE_LOG_TAIL '+log.name+' '+log.read_text()[-18000:])
          PY
      - name: Retain new exports only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rg-d4-two-larger-original-long-class-batches-exports-${{ github.run_id }}-${{ strategy.job-index }}
          path: Proofs/RG_Lean_20261019/build/fresh_exports
          retention-days: 7
