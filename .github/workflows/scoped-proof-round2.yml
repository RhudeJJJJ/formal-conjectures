name: Scoped proof round 2
on:
  push:
    branches: [proof-round2-20261016]
  workflow_dispatch:
concurrency:
  group: proof-round2-final
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pinned Lean
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Get pinned Mathlib cache
        run: lake exe cache get
      - name: Restore statement build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .lake/build
          key: round2-imports-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: round2-imports-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Build exact statement imports
        run: lake --wfail build FormalConjectures.WrittenOnTheWallII.GraphConjecture404To407 FormalConjectures.WrittenOnTheWallII.GraphConjecture362 FormalConjectures.Arxiv.«2601.18071».GreenEigenvalue
      - name: Save checked statement imports
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .lake/build
          key: round2-imports-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
      - name: Check corona proof and axioms
        if: always()
        run: lake env lean -DwarningAsError=true Proofs/CoronaTwoDominatingProof.lean
      - name: Check support components and axioms
        if: always()
        run: lake env lean -DwarningAsError=true Proofs/SupportComponentsProof.lean
      - name: Check Knill proof and axioms
        if: always()
        timeout-minutes: 8
        run: lake env lean -DwarningAsError=true Proofs/KnillGreenProof.lean
