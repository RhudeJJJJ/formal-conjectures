name: RG Middle residual Batch024 sample split

on:
  push:
    branches: [rg-middle-residual-batch024-split-20261109]
    paths:
      - '.github/workflows/rg-middle-residual-batch024-split-20261109.yml'
      - 'ci/rg_middle_residual_batch024_split_check_20261109.py'
      - 'ci/rg_middle_residual_batch024_split_inventory_20261109.json'
      - 'ci/rg_middle_residual_sample_split_20261109.py'
      - 'ci/rg_middle_residual_batch024_split_plan_20261109.py'
      - 'Proofs/RG_Lean_20261019/Proofs/RadenkovicGutmanDegreeOneMiddleResidualSpectrum1715.lean'
      - 'Proofs/RG_Lean_20261019/Proofs/RadenkovicGutmanDegreeOneMiddleResidualSpectrum1749.lean'
      - 'Proofs/RG_Lean_20261019/Proofs/RadenkovicGutmanDegreeOneMiddleResidualSpectrum1956.lean'
      - 'Proofs/RG_Lean_20261019/Proofs/RadenkovicGutmanDegreeOneMiddleResidualSpectrum2356.lean'
      - 'Proofs/RG_Lean_20261019/Proofs/RadenkovicGutmanDegreeOneMiddleResidualSpectrum2357.lean'
      - 'Proofs/RG_Lean_20261019/Proofs/RadenkovicGutmanDegreeOneMiddleResidualSpectrum2358.lean'

permissions:
  contents: read
  actions: read

jobs:
  check:
    name: residual-batch024-sample-split
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Fetch the immutable original source commit
        run: git fetch --no-tags --depth 1 origin 15d45e8d3ed3bacaf3afe7d85488a42f08302d76
      - name: Check six exact sample splits and the original three-key batch
        run: python3 -B ci/rg_middle_residual_batch024_split_check_20261109.py --retain
      - name: Install the project toolchain
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Materialize the exact dependency lock
        run: python3 -B ci/rg_dependencies.py
      - name: Fetch the required Mathlib cache
        run: |
          python3 - <<'PY'
          import pathlib,re,subprocess
          root=pathlib.Path('Proofs/RG_Lean_20261019')
          seen,external=set(),set()
          def visit(name):
              if name in seen:return
              seen.add(name)
              for dep in re.findall(r'^\s*import\s+([\w.]+)',(root/(name.replace('.','/')+'.lean')).read_text(),re.M):
                  if dep.startswith('Proofs.'):visit(dep)
                  elif not dep.startswith(('Lean.','Init.','Std.')) and dep not in ('Lean','Init','Std'):external.add(dep)
          visit('Proofs.RadenkovicGutmanDegreeOneMiddleResidualFiniteCertificateBatch024')
          subprocess.run(['lake','exe','cache','get',*sorted(external)],check=True)
          PY
      - name: Restore the audited original common scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B ci/rg_restore_complete_scope.py --manifest ci/rg_reusable_analytic_kernel_base_complete_scope_capsule.json --build-directory Proofs/RG_Lean_20261019/build/extension
      - name: Restore authenticated common and list exports in fixed order
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,subprocess,sys
          manifests=json.load(open('ci/rg_middle_residual_certificates000_restore_plan_20261108.json'))
          assert manifests==['ci/rg_all111_finite_original_projected_parents_20261028/083.json','ci/rg_middle_residual_list_assembly_run42345489172_prior_exports.json']
          for manifest in manifests:
              subprocess.run([sys.executable,'-B','ci/rg_restore_job_exports.py','--manifest',manifest,'--build-directory','Proofs/RG_Lean_20261019/build/extension'],check=True)
          PY
      - name: Bound the fresh frontier to eleven modules and forty-five original priors
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B ci/rg_restore_with_kernel_fallback.py --plan ci/rg_middle_residual_certificates000_restore_plan_20261108.json --build-directory Proofs/RG_Lean_20261019/build/extension --endpoint Proofs.RadenkovicGutmanDegreeOneMiddleResidualFiniteCertificateBatch024 --max-fresh 11 --preflight-only
      - name: Check six split spectra and the unchanged original batch declarations
        shell: bash
        run: |
          set -o pipefail
          python3 -B ci/rg_observed_kernel_verify.py --memory-reserve-mib 2048 -- --mathlib-project "$GITHUB_WORKSPACE" --endpoint Proofs.RadenkovicGutmanDegreeOneMiddleResidualFiniteCertificateBatch024 --workers 1 --module-timeout 600 --resume | python3 -B ci/rg_compact_ci_output.py
      - name: Check the exact receipt and 151 ordered standard axiom profiles
        run: python3 -B ci/rg_middle_residual_batch024_split_check_20261109.py --receipt
      - name: Retain completed records and native compiled objects
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib,shutil,sys
          project=pathlib.Path('Proofs/RG_Lean_20261019')
          sys.path.insert(0,str(project.resolve()))
          from module_outputs import output_members
          root=project/'build/extension'
          records=[json.loads(p.read_text()) for p in sorted(root.glob('Proofs.*.json'))]
          fresh=project/'build/fresh_exports';fresh.mkdir(parents=True,exist_ok=True)
          (fresh/'diagnostics_records.json').write_text(json.dumps({'modules':records},separators=(',',':'))+'\n')
          if (root/'receipt.json').is_file():shutil.copyfile(root/'receipt.json',fresh/'receipt.json')
          print('RETAINED_RECORD_COUNTS '+json.dumps({'total':len(records),'fresh':sum(r['mode']=='FRESH_KERNEL_EXPORT' for r in records)}))
          for row in records:
              if row['mode']=='FRESH_KERNEL_EXPORT':
                  name=row['module']
                  for rel,expected_sha,expected_size in output_members(name,row):
                      dest=fresh/rel;dest.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(root/rel,dest)
                  shutil.copyfile(root/(name+'.json'),fresh/(name+'.json'))
          for log in root.glob('Proofs.*.log'):
              shutil.copyfile(log,fresh/log.name);print('MODULE_LOG_TAIL '+log.name+' '+log.read_text()[-18000:])
          PY
      - name: Retain new-source evidence for independent authentication
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rg-middle-residual-batch024-split-20261109-${{ github.run_id }}
          path: Proofs/RG_Lean_20261019/build/fresh_exports
          retention-days: 90
