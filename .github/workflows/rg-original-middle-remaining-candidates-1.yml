name: RG remaining original middle anchor candidate searches 1

on:
  push:
    branches: [rg-remaining-six-spectral-20261021]
    paths: ['.github/workflows/rg-original-middle-remaining-candidates-1.yml']

permissions:
  contents: read

jobs:
  search:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        anchor: [250,251,252,253,254,255,256,257,258,259,260,261,262,263,264,265,266,267,268,269,270,271,272,273,274,275,276,277,278,279,280,281,282,283,284,285,286,287,288,289,290,291,292,293,294,295,296,297,298,299,300,301,302,303,304,305,306,307,308,309,310,311,312,313,314,315,316,317,318,319,320,321,322,323,324,325,326,327,328,329,330,331,332,333,334,335,336,337,338,339,340,341,342,343,344,345,346,347,348,349,350,351,352,353,354,355,356,357,358,359,360,361,362,363,364,365,366,367,368,369,370,371,372,373,374,375,376,377,378,379,380,381,382,383,384,385,386,387,388,389,390,391,392,393,394,395,396,397,398,399,400,401,402,403,404,405,406,407,408,409,410,411,412,413,414,415,416,417,418,419,420,421,422,423,424,425,426,427,428,429,430,431,432,433,434,435,436,437,438,439,440,441,442,443,444,445,446,447,448,449,450,451,452,453,454,455,456,457,458,459,460,461,462,463,464]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check the corrected exact candidate producer and unchanged original anchor source
        run: |
          python3 -B - <<'PY'
          import hashlib,json,pathlib
          m=json.loads(pathlib.Path('ci/rg_anchor_candidate_reference_manifest.json').read_bytes())
          for row in m['sources']:
              assert hashlib.sha256(pathlib.Path(row['file']).read_bytes()).hexdigest()==row['sha256'],row['file']
          PY
      - name: Generate bounded exact candidates for the same original target
        run: python3 -B ci/rg_anchor_candidate_reference/prepare_rg_compact_anchor_candidates.py --anchor-index ${{ matrix.anchor }} --max-seconds 900 --max-cells 2048
      - name: Retain exact witnesses, checkpoints and original target provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rg-original-middle-remaining-candidates-1-${{ github.run_id }}-${{ matrix.anchor }}
          path: work/rg_anchor_candidates
          retention-days: 90
