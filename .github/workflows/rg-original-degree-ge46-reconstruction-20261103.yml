name: RG original degree at least 46 reconstruction
on:
  push:
    branches: [rg-degree-one-large-20261103]
    paths: ['.github/workflows/rg-original-degree-ge46-reconstruction-20261103.yml']
permissions:
  contents: read
  actions: read
jobs:
  check:
    name: Restore original degree at least 46
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install the project toolchain
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Materialize the exact dependency lock
        run: python3 -B ci/rg_dependencies.py
      - name: Fetch the required Mathlib cache
        run: |
          python3 - <<'PY'
          import pathlib,re,subprocess
          root=pathlib.Path('Proofs/RG_Lean_20261019')
          seen,external=set(),set()
          def visit(name):
              if name in seen:return
              seen.add(name)
              source=(root/(name.replace('.','/')+'.lean')).read_text()
              for dep in re.findall(r'^\s*import\s+([\w.]+)',source,re.M):
                  if dep.startswith('Proofs.'):visit(dep)
                  elif not dep.startswith(('Lean.','Init.','Std.')) and dep not in ('Lean','Init','Std'):external.add(dep)
          visit('Proofs.RadenkovicGutmanOriginalDegreeGeFortysix')
          subprocess.run(['lake','exe','cache','get',*sorted(external)],check=True)
          PY
      - name: Restore the available independently audited base
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          spec=json.loads(pathlib.Path('ci/rg_original_degree_ge46_20261103_spec.json').read_text())
          assert spec['base_manifest']=='ci/rg_reusable_analytic_kernel_base_complete_scope_capsule.json'
          assert hashlib.sha256(pathlib.Path(spec['base_manifest']).read_bytes()).hexdigest()==spec['base_manifest_sha256']
          PY
          python3 -B ci/rg_restore_complete_scope.py --manifest ci/rg_reusable_analytic_kernel_base_complete_scope_capsule.json --build-directory Proofs/RG_Lean_20261019/build/extension
      - name: Bind every fresh module to its original source and closure
        run: |
          python3 -B ci/rg_restore_with_kernel_fallback.py --plan ci/rg_empty_restore_plan.json --build-directory Proofs/RG_Lean_20261019/build/extension --endpoint Proofs.RadenkovicGutmanOriginalDegreeGeFortysix --max-fresh 67 --preflight-only
          python3 - <<'PY'
          import json,pathlib
          report=json.loads(pathlib.Path('Proofs/RG_Lean_20261019/build/extension/bounded_kernel_fallback_plan.json').read_bytes())
          assert report['required_modules']==124
          PY
          python3 -B ci/rg_assert_source_bound_fresh_frontier.py --spec ci/rg_original_degree_ge46_20261103_spec.json --build-directory Proofs/RG_Lean_20261019/build/extension
          mkdir -p Proofs/RG_Lean_20261019/build/fresh_exports
          cp Proofs/RG_Lean_20261019/build/extension/bounded_kernel_fallback_plan.json Proofs/RG_Lean_20261019/build/fresh_exports/ge46_frontier.json
      - name: Reconstruct the original degree at least 46 closure with the strict kernel verifier
        shell: bash
        run: |
          set -o pipefail
          python3 -B ci/rg_observed_kernel_verify.py --memory-reserve-mib 2048 -- --mathlib-project "$GITHUB_WORKSPACE" --endpoint Proofs.RadenkovicGutmanOriginalDegreeGeFortysix --workers 1 --module-timeout 1200 --resume | python3 -B ci/rg_compact_ci_output.py
      - name: Require the original object, member and axiom identities
        shell: bash
        run: |
          set -o pipefail
          python3 -B ci/rg_assert_source_bound_fresh_frontier.py --spec ci/rg_original_degree_ge46_20261103_spec.json --build-directory Proofs/RG_Lean_20261019/build/extension --phase after | tee Proofs/RG_Lean_20261019/build/fresh_exports/ge46_identity_check.json
      - name: Retain completed records, complete module outputs and diagnostics
        if: always()
        run: python3 -B ci/rg_collect_fresh_exports.py --build-directory Proofs/RG_Lean_20261019/build/extension --output-directory Proofs/RG_Lean_20261019/build/fresh_exports
      - name: Retain original degree at least 46 reconstruction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rg-original-degree-ge46-20261103-${{ github.run_id }}-${{ github.run_attempt }}
          path: Proofs/RG_Lean_20261019/build/fresh_exports
          retention-days: 90
