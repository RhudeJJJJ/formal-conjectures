name: RG first actual strict fusion and exact cutoff reduction

on:
  push:
    branches: [rg-lean-topology-20261019]
    paths:
      - 'Proofs/RG_Lean_20261019/**'
      - '.github/workflows/rg-fusion-descent.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install the project toolchain
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned dependencies
        run: lake update
      - name: Fetch the required Mathlib cache
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess
          root = pathlib.Path('Proofs/RG_Lean_20261019')
          seen, external = set(), set()
          def visit(name):
              if name in seen:
                  return
              seen.add(name)
              source = (root / (name.replace('.', '/') + '.lean')).read_text()
              for dep in re.findall(r'^\s*import\s+([\w.]+)', source, re.M):
                  if dep.startswith('Proofs.'):
                      visit(dep)
                  else:
                      external.add(dep)
          visit('Proofs.RadenkovicGutmanMinimalFusion')
          subprocess.run(['lake', 'exe', 'cache', 'get', *sorted(external)], check=True)
          PY
      - name: Check the source closure and axiom profiles
        run: |
          python3 -B Proofs/RG_Lean_20261019/verify_extension.py \
            --mathlib-project "$GITHUB_WORKSPACE" \
            --endpoint Proofs.RadenkovicGutmanMinimalFusion \
            --workers 1 --module-timeout 900 --print-receipt
