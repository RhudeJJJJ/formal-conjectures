name: RG exact degree-one-large and three remaining families

on:
  push:
    branches: [rg-degree-one-large-20261103]
    paths: ['.github/workflows/rg-degree-one-large-final-20261103.yml']

permissions:
  contents: read
  actions: read

jobs:
  check:
    if: github.repository == 'RhudeJJJJ/formal-conjectures'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Reserve actual host space without touching proof inputs
        run: python3 -B ci/rg_prepare_finite_runner_storage.py --required-free-gib 45
      - name: Reproduce the already checked shared class sources
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          plan = json.load(open('ci/rg_shared_arm_materialization_plan.json'))
          for index in plan['classes']['30']['open_chunk_indices']:
              subprocess.run([sys.executable, '-B', 'ci/rg_materialize_shared_arm.py',
                              '--tag', '30', '--chunk', str(index)], check=True)
          PY
      - name: Establish exact current closure and available original object coverage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -B ci/rg_plan_exact_degree_one_large.py \
            --endpoint Proofs.RadenkovicGutmanRemainingThreeAssembly \
            --output Proofs/RG_Lean_20261019/build/exact_degree_one_plan.json
      - name: Install the fixed project toolchain
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Materialize the fixed dependency lock
        run: python3 -B ci/rg_dependencies.py
      - name: Fetch only the external modules of this exact source closure
        run: |
          python3 - <<'PY'
          import json, pathlib, re, subprocess, sys
          root = pathlib.Path('Proofs/RG_Lean_20261019')
          sys.path.insert(0, str(root))
          from verify import without_comments
          plan = json.loads((root / 'build/exact_degree_one_plan.json').read_bytes())
          external = set()
          for name in plan['source_sha256']:
              base = root / 'ThirdParty/LeanCert' if name.startswith('LeanCert.') else root
              text = without_comments((base / (name.replace('.', '/') + '.lean')).read_text())
              for dep in re.findall(r'^\s*(?:public\s+)?import\s+([\w.]+)\s*$', text, re.M):
                  if not dep.startswith(('Proofs.', 'LeanCert.', 'Lean.', 'Init.', 'Std.')) and dep not in ('Lean', 'Init', 'Std'):
                      external.add(dep)
          subprocess.run(['lake', 'exe', 'cache', 'get', *sorted(external)], check=True)
          PY
      - name: Install the transparent filesystem utility
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y btrfs-progs
      - name: Create a new bounded logical proofstore without formatting an existing disk
        run: python3 -B ci/rg_ephemeral_compressed_proofstore.py --logical-gib 256
      - name: Authenticate and read back every selected original object and sidecar
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -B ci/rg_restore_exact_compressed_plan.py \
            --plan Proofs/RG_Lean_20261019/build/exact_degree_one_plan.json \
            --build-directory Proofs/RG_Lean_20261019/build/extension
      - name: Recompute and enforce the exact three-module fresh frontier
        run: |
          python3 -B ci/rg_restore_with_kernel_fallback.py \
            --plan ci/rg_empty_restore_plan.json \
            --build-directory Proofs/RG_Lean_20261019/build/extension \
            --endpoint Proofs.RadenkovicGutmanRemainingThreeAssembly \
            --max-fresh 3 --preflight-only
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('Proofs/RG_Lean_20261019/build')
          planned = json.loads((root / 'exact_degree_one_plan.json').read_bytes())
          actual = json.loads((root / 'extension/bounded_kernel_fallback_plan.json').read_bytes())
          assert set(actual['fresh_modules']) == set(planned['fresh_modules'])
          assert actual['required_modules'] == planned['required_modules']
          assert set(actual['fresh_modules']) == set(planned['fresh_allowlist'])
          PY
      - name: Check the final class, full original family, and three-field assembly
        shell: bash
        run: |
          set -o pipefail
          python3 -B ci/rg_run_with_host_reserve.py -- \
            python3 -B ci/rg_observed_kernel_verify.py --memory-reserve-mib 2048 -- \
            --mathlib-project "$GITHUB_WORKSPACE" \
            --endpoint Proofs.RadenkovicGutmanRemainingThreeAssembly \
            --workers 1 --module-timeout 900 --resume | python3 -B ci/rg_compact_ci_output.py
      - name: Retain complete fresh outputs, axiom profiles, and diagnostics
        if: always()
        run: |
          python3 -B ci/rg_collect_fresh_exports.py \
            --build-directory Proofs/RG_Lean_20261019/build/extension \
            --output-directory Proofs/RG_Lean_20261019/build/fresh_exports
      - name: Preserve original evidence and measured resource results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rg-degree-one-large-final-${{ github.run_id }}
          path: |
            Proofs/RG_Lean_20261019/build/fresh_exports
            Proofs/RG_Lean_20261019/build/exact_degree_one_plan.json
            Proofs/RG_Lean_20261019/build/extension/bounded_kernel_fallback_plan.json
            rg-proofstore-setup.json
            rg-proofstore-roundtrip-reports
            rg-proofstore-kernel-reserve.json
          retention-days: 90

