name: RG complete original remaining52 other-order middle anchors

on:
  push:
    branches: [rg-remaining-six-spectral-20261021]
    paths: ['.github/workflows/rg-middle-other52-complete-original-anchors.yml']

permissions:
  contents: read
  actions: read

jobs:
  check:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        endpoint: [Proofs.RadenkovicGutmanWideAnchor225OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor228OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor231OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor248OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor249OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor250OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor251OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor274OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor275OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor276OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor279OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor280OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor283OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor284OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor370OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor371OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor374OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor377OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor393OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor394OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor395OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor396OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor417OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor418OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor419OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor420OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor421OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor424OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor425OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor426OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor427OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor428OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor431OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor432OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor433OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor479OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor482OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor516OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor517OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor518OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor519OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor522OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor523OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor524OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor525OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor526OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor529OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor530OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor572OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor606OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor607OriginalAnchor,Proofs.RadenkovicGutmanWideAnchor610OriginalAnchor]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install the project toolchain
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Materialize the exact dependency lock
        run: python3 -B ci/rg_dependencies.py
      - name: Produce exact data and the complete original anchor proof
        run: python3 -B ci/rg_run_original_anchor_kernel.py --endpoint ${{ matrix.endpoint }}
      - name: Fetch the required Mathlib cache
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess
          root = pathlib.Path('Proofs/RG_Lean_20261019')
          seen, external = set(), set()
          def visit(name):
              if name in seen:
                  return
              seen.add(name)
              source = (root / (name.replace('.', '/') + '.lean')).read_text()
              for dep in re.findall(r'^\s*import\s+([\w.]+)', source, re.M):
                  if dep.startswith('Proofs.'):
                      visit(dep)
                  elif not dep.startswith(('Lean.', 'Init.', 'Std.')) and dep not in ('Lean','Init','Std'):
                      external.add(dep)
          visit('${{ matrix.endpoint }}')
          subprocess.run(['lake', 'exe', 'cache', 'get', *sorted(external)], check=True)
          PY
      - name: Restore one independently audited complete source-bound base scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B ci/rg_restore_complete_scope.py --manifest ci/rg_reusable_analytic_kernel_base_complete_scope_capsule.json --build-directory Proofs/RG_Lean_20261019/build/extension
      - name: Restore independently audited exact control proofs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B ci/rg_restore_plan_parallel.py --plan ci/rg_symbolic_anchor005_control_prior_restore_plan.json --build-directory Proofs/RG_Lean_20261019/build/extension --workers 2
      - name: Bound the remaining fresh module frontier
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B ci/rg_restore_with_kernel_fallback.py --plan ci/rg_symbolic_anchor005_control_prior_restore_plan.json --build-directory Proofs/RG_Lean_20261019/build/extension --endpoint ${{ matrix.endpoint }} --max-fresh 512 --preflight-only
      - name: Check multiplicities and actual graph spectral comparison
        shell: bash
        run: |
          set -o pipefail
          python3 -B ci/rg_adaptive_anchor_kernel_verify.py --mathlib-project "$GITHUB_WORKSPACE" --endpoint ${{ matrix.endpoint }} | python3 -B ci/rg_compact_ci_output.py
      - name: Retain completed records and diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib,shutil
          root=pathlib.Path('Proofs/RG_Lean_20261019/build/extension')
          records=[json.loads(p.read_text()) for p in sorted(root.glob('Proofs.*.json'))]
          fresh=root.parent/'fresh_exports';fresh.mkdir(parents=True,exist_ok=True)
          (fresh/'diagnostics_records.json').write_text(json.dumps({'modules':records},separators=(',',':'))+'\n')
          if (root/'receipt.json').is_file():shutil.copyfile(root/'receipt.json',fresh/'receipt.json')
          print('RETAINED_RECORD_COUNTS '+json.dumps({'total':len(records),'fresh':sum(r['mode']=='FRESH_KERNEL_EXPORT' for r in records)}))
          for row in records:
              if row['mode']=='FRESH_KERNEL_EXPORT':
                  name=row['module'];rel=name.replace('.','/')+'.olean';dest=fresh/rel
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(root/rel,dest);shutil.copyfile(root/(name+'.json'),fresh/(name+'.json'))
          for log in root.glob('Proofs.*.log'):
              shutil.copyfile(log,fresh/log.name);print('MODULE_LOG_TAIL '+log.name+' '+log.read_text()[-18000:])
          PY
      - name: Retain new exports only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rg-middle-other52-complete-original-anchors-exports-${{ github.run_id }}-${{ strategy.job-index }}
          path: Proofs/RG_Lean_20261019/build/fresh_exports
          retention-days: 90
