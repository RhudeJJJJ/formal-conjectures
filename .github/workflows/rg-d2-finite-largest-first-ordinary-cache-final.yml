# Previous single main module timed out after1200 seconds; all13946 priors and all axiom checks retained.
name: RG original full finite proof with largest first ordinary storage

on:
  push:
    branches: [rg-remaining-six-spectral-20261021]
    paths: ['.github/workflows/rg-d2-finite-largest-first-ordinary-cache-final.yml']

permissions:
  contents: read
  actions: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        endpoint: [Proofs.RadenkovicGutmanDegreeTwoThreeFiniteAllCertificates]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Reserve capacity on this fresh hosted runner for all finite proof objects
        run: python3 -B ci/rg_prepare_finite_runner_storage.py --required-free-gib 45
      - name: Install the project toolchain
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Materialize the exact dependency lock
        run: python3 -B ci/rg_dependencies.py
      - name: Fetch the required Mathlib cache
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess
          root = pathlib.Path('Proofs/RG_Lean_20261019')
          seen, external = set(), set()
          def visit(name):
              if name in seen:
                  return
              seen.add(name)
              source = (root / (name.replace('.', '/') + '.lean')).read_text()
              for dep in re.findall(r'^\s*import\s+([\w.]+)', source, re.M):
                  if dep.startswith('Proofs.'):
                      visit(dep)
                  elif not dep.startswith(('Lean.', 'Init.', 'Std.')) and dep not in ('Lean','Init','Std'):
                      external.add(dep)
          visit('${{ matrix.endpoint }}')
          subprocess.run(['lake', 'exe', 'cache', 'get', *sorted(external)], check=True)
          PY
      - name: Use measured transparent compressed storage for original proof objects
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y btrfs-progs
          python3 -B ci/rg_ephemeral_compressed_proofstore.py --logical-gib 256
      - name: Restore exact source-bound prerequisites with two bounded workers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B ci/rg_restore_with_kernel_fallback.py --plan ci/rg_d2_finite_list_final_restore_plan.json --build-directory Proofs/RG_Lean_20261019/build/extension --workers 2 --endpoint Proofs.RadenkovicGutmanDegreeTwoThreeFiniteAllCertificates --max-fresh 1 --unavailable-artifacts ci/rg_unavailable_prior_artifacts_20261023.json
      - name: Preserve every proof object and cache a bounded set on ordinary storage
        run: python3 -B ci/rg_materialize_largest_first_ordinary_proof_cache.py --source-directory Proofs/RG_Lean_20261019/build/extension --target-directory work/rg_d2_largest_ordinary_20261024 --copy-budget-gib 32 --minimum-host-reserve-gib 8
      - name: Check multiplicities and actual graph spectral comparison
        shell: bash
        run: |
          set -o pipefail
          python3 -B ci/rg_run_with_host_reserve.py -- python3 -B ci/rg_trace_owned_kernel_resources.py -- python3 -B Proofs/RG_Lean_20261019/verify_extension.py --mathlib-project "$GITHUB_WORKSPACE" --build-directory "$GITHUB_WORKSPACE/work/rg_d2_largest_ordinary_20261024" --endpoint ${{ matrix.endpoint }} --workers 1 --module-timeout 3600 --profile --resume | python3 -B ci/rg_compact_ci_output.py
      - name: Retain completed records and diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib,shutil,os
          root=pathlib.Path('work/rg_d2_largest_ordinary_20261024')
          records=[json.loads(p.read_text()) for p in sorted(root.glob('Proofs.*.json'))]
          fresh=root/'fresh_exports';fresh.mkdir(parents=True,exist_ok=True)
          (fresh/'diagnostics_records.json').write_text(json.dumps({'modules':records},separators=(',',':'))+'\n')
          if (root/'receipt.json').is_file():shutil.copyfile(root/'receipt.json',fresh/'receipt.json')
          for report in root.glob('ORDINARY_PROOF_CACHE_*.json'):shutil.copyfile(report,fresh/report.name);print('LAYOUT_REPORT '+report.read_text())
          print('RETAINED_RECORD_COUNTS '+json.dumps({'total':len(records),'fresh':sum(r['mode']=='FRESH_KERNEL_EXPORT' for r in records)}))
          for row in records:
              if row['mode']=='FRESH_KERNEL_EXPORT':
                  name=row['module'];rel=name.replace('.','/')+'.olean';dest=fresh/rel
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  os.link(root/rel,dest);shutil.copyfile(root/(name+'.json'),fresh/(name+'.json'))
          for log in root.glob('Proofs.*.log'):
              shutil.copyfile(log,fresh/log.name);print('MODULE_LOG_TAIL '+log.name+' '+log.read_text()[-18000:])
          PY
      - name: Retain new exports only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rg-d2-finite-largest-first-ordinary-cache-final-exports-${{ github.run_id }}-${{ strategy.job-index }}
          path: work/rg_d2_largest_ordinary_20261024/fresh_exports
          retention-days: 30
