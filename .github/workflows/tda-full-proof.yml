name: Total domination annihilation proof development
on:
  push:
    branches: [tda-full-proof-20261019]
  workflow_dispatch:
concurrency:
  group: tda-full-proof-20261019
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pinned Lean
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Get pinned Mathlib cache
        run: lake exe cache get
      - name: Restore exact statement imports
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .lake/build
          key: tda-imports-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            tda-imports-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            round8-imports-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            round7-imports-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Compile exact target statement
        run: lake --wfail build FormalConjectures.Paper.TotalDominationAnnihilation
      - name: Save statement imports
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .lake/build
          key: tda-imports-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
      - name: Kernel check current components
        run: |
          set +e
          mkdir -p .lake/build/lib/lean/Proofs
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/Proofs/TDABudget.olean Proofs/TDABudget.lean
          budget=$?
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/Proofs/TDAHypergraphBase.olean Proofs/TDAHypergraphBase.lean
          hypergraph=$?
          mkdir -p .lake/build/lib/lean/Proofs
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/Proofs/ZajacBrooks.olean Proofs/ZajacBrooks.lean
          brooks=$?
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/Proofs/TDAUniform.olean Proofs/TDAUniform.lean
          uniform=$?
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/Proofs/TDAMixedBase.olean Proofs/TDAMixedBase.lean
          mixed=$?
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/Proofs/TDAMixed.olean Proofs/TDAMixed.lean
          mixed_end=$?
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/Proofs/TDAOptimal.olean Proofs/TDAOptimal.lean
          optimal=$?
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/Proofs/TDADegreeBudget.olean Proofs/TDADegreeBudget.lean
          rounding=$?
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/Proofs/TDANeighborhood.olean Proofs/TDANeighborhood.lean
          neighborhood=$?
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/Proofs/TDAGraphBasics.olean Proofs/TDAGraphBasics.lean
          basics=$?
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/Proofs/TDACoreCover.olean Proofs/TDACoreCover.lean
          core_cover=$?
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/Proofs/TDALeafCounts.olean Proofs/TDALeafCounts.lean
          leaf_counts=$?
          lake env lean -DwarningAsError=true -o .lake/build/lib/lean/Proofs/TDAGeneralBound.olean Proofs/TDAGeneralBound.lean
          general=$?
          lake env lean -DwarningAsError=true Proofs/TDAGraphBudget.lean
          graph_budget=$?
          exit $((budget || hypergraph || brooks || uniform || mixed || mixed_end || optimal || rounding || neighborhood || basics || core_cover || leaf_counts || general || graph_budget))
