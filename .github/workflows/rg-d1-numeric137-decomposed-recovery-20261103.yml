name: RG numeric137 declaration-preserving full batch recovery
# The earlier fixed-source reconstruction is already running. Updating only
# audit metadata must not repeat its expensive kernel work automatically.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
env:
  RG_NUMERIC137_SPEC_SHA256: 215ae3b2b69a4d7f9f00d694228a45333df0b73e588a6b2f0f61c97b45db4302
jobs:
  recover:
    name: Check complete numeric00_137 with original declarations in bounded modules
    runs-on: ubuntu-24.04
    # One reorganized leaf, eleven support modules, and nine unchanged leaves.
    # Every module keeps the original 1200-second cap and 2048-MiB reserve.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Bind every original declaration and all ten original endpoint names
        run: python3 -B ci/rg_numeric137_decomposed_recovery.py --spec-sha256 "$RG_NUMERIC137_SPEC_SHA256" --phase materialize
      - name: Install the fixed project toolchain
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Materialize the exact dependency lock
        run: python3 -B ci/rg_dependencies.py
      - name: Fetch the exact external cache scope
        run: python3 -B ci/rg_numeric137_decomposed_recovery.py --spec-sha256 "$RG_NUMERIC137_SPEC_SHA256" --phase cache
      - name: Restore the retained complete audited analytic base
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B ci/rg_restore_complete_scope.py --manifest ci/rg_reusable_analytic_kernel_base_complete_scope_capsule.json --build-directory Proofs/RG_Lean_20261019/build/extension
      - name: Require the exact twenty-one-module fresh frontier
        run: python3 -B ci/rg_numeric137_decomposed_recovery.py --spec-sha256 "$RG_NUMERIC137_SPEC_SHA256" --phase preflight
      - name: Check all original endpoints and their current support with one worker
        shell: bash
        run: |
          set -o pipefail
          python3 -B ci/rg_numeric137_decomposed_recovery.py --spec-sha256 "$RG_NUMERIC137_SPEC_SHA256" --phase kernel | python3 -B ci/rg_compact_ci_output.py
      - name: Authenticate current exports and the nine unchanged historical objects
        run: python3 -B ci/rg_numeric137_decomposed_recovery.py --spec-sha256 "$RG_NUMERIC137_SPEC_SHA256" --phase compare
      - name: Retain completed records and every declared output member
        if: always()
        run: python3 -B ci/rg_collect_fresh_exports.py --build-directory Proofs/RG_Lean_20261019/build/extension --output-directory Proofs/RG_Lean_20261019/build/fresh_exports
      - name: Retain full batch proof exports and partial diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rg-d1-numeric-decomposed-00_137-${{ github.run_id }}-${{ github.run_attempt }}
          path: Proofs/RG_Lean_20261019/build/fresh_exports
          retention-days: 90
