name: Scoped proof round 7
on:
  push:
    branches: [proof-round7-20261018]
  workflow_dispatch:
concurrency:
  group: proof-round7
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pinned Lean
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Get pinned Mathlib cache
        run: lake exe cache get
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .lake/build
          key: round7-imports-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: round7-imports-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Build exact statement
        run: lake --wfail build FormalConjectures.WrittenOnTheWallII.GraphConjecture365
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .lake/build
          key: round7-imports-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
      - name: Check complete proofs and axioms
        timeout-minutes: 5
        run: lake env lean -DwarningAsError=true Proofs/WOWII365Proof.lean
