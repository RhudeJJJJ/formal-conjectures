name: Scoped Erdos617 affine and three-colour proofs
on:
  push:
    branches: [proof-617-affine-three-20261020]
  workflow_dispatch:
concurrency:
  group: proof-617-affine-three-20261020
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pinned Lean
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Get pinned Mathlib cache
        run: lake exe cache get
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .lake/build
          key: round9-imports-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            round9-imports-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            round8-imports-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Build exact statement
        run: lake --wfail build 'FormalConjectures.ErdosProblems.«617»'
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .lake/build
          key: round9-imports-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
      - name: Check affine proof
        run: lake env lean -DwarningAsError=true Proofs/Erdos617AffineProof.lean
      - name: Check three-colour core
        run: lake env lean -DwarningAsError=true -o .lake/build/lib/lean/Proofs/Erdos617ThreeCore.olean Proofs/Erdos617ThreeCore.lean
      - name: Check inherited Brooks proof
        run: lake env lean -DwarningAsError=true -o .lake/build/lib/lean/Proofs/ZajacBrooks.olean Proofs/ZajacBrooks.lean
