name: RG verified spectral evidence collection
on:
  push:
    branches: [rg-remaining-six-spectral-20261021]
    paths:
      - 'ci/rg_collect_verified_evidence.py'
      - 'ci/rg_d2_spectral_wave1_evidence_plan.json'
      - '.github/workflows/rg-d2-spectral-wave1-evidence.yml'
permissions:
  contents: read
  actions: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Verify original archive and object bytes without recompiling mathematics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B ci/rg_collect_verified_evidence.py --plan ci/rg_d2_spectral_wave1_evidence_plan.json --output build/rg_d2_spectral_wave1_evidence
      - name: Preserve full receipts, logs and verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rg-d2-spectral-wave1-complete-evidence-${{ github.run_id }}
          path: build/rg_d2_spectral_wave1_evidence
          retention-days: 7
