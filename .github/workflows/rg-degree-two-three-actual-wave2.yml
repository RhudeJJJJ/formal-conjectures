on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include: [{"endpoint":"Proofs.RadenkovicGutmanDegreeTwoThreeFiniteCertificateBatch032","plan":"ci/rg_degree_two_three_actual_wave2_batch032_plan.json"},{"endpoint":"Proofs.RadenkovicGutmanDegreeTwoThreeFiniteCertificateBatch033","plan":"ci/rg_degree_two_three_actual_wave2_batch033_plan.json"},{"endpoint":"Proofs.RadenkovicGutmanDegreeTwoThreeFiniteCertificateBatch034","plan":"ci/rg_degree_two_three_actual_wave2_batch034_plan.json"},{"endpoint":"Proofs.RadenkovicGutmanDegreeTwoThreeFiniteCertificateBatch037","plan":"ci/rg_degree_two_three_actual_wave2_batch037_plan.json"},{"endpoint":"Proofs.RadenkovicGutmanDegreeTwoThreeFiniteCertificateBatch038","plan":"ci/rg_degree_two_three_actual_wave2_batch038_plan.json"},{"endpoint":"Proofs.RadenkovicGutmanDegreeTwoThreeFiniteCertificateBatch039","plan":"ci/rg_degree_two_three_actual_wave2_batch039_plan.json"},{"endpoint":"Proofs.RadenkovicGutmanDegreeTwoThreeFiniteCertificateBatch040","plan":"ci/rg_degree_two_three_actual_wave2_batch040_plan.json"},{"endpoint":"Proofs.RadenkovicGutmanDegreeTwoThreeFiniteCertificateBatch041","plan":"ci/rg_degree_two_three_actual_wave2_batch041_plan.json"},{"endpoint":"Proofs.RadenkovicGutmanDegreeTwoThreeFiniteCertificateBatch044","plan":"ci/rg_degree_two_three_actual_wave2_batch044_plan.json"},{"endpoint":"Proofs.RadenkovicGutmanDegreeTwoThreeFiniteCertificateBatch045","plan":"ci/rg_degree_two_three_actual_wave2_batch045_plan.json"},{"endpoint":"Proofs.RadenkovicGutmanDegreeTwoThreeFiniteCertificateBatch046","plan":"ci/rg_degree_two_three_actual_wave2_batch046_plan.json"},{"endpoint":"Proofs.RadenkovicGutmanDegreeTwoThreeFiniteCertificateBatch047","plan":"ci/rg_degree_two_three_actual_wave2_batch047_plan.json"},{"endpoint":"Proofs.RadenkovicGutmanDegreeTwoThreeFiniteCertificateBatch048","plan":"ci/rg_degree_two_three_actual_wave2_batch048_plan.json"},{"endpoint":"Proofs.RadenkovicGutmanDegreeTwoThreeFiniteCertificateBatch062","plan":"ci/rg_degree_two_three_actual_wave2_batch062_plan.json"},{"endpoint":"Proofs.RadenkovicGutmanDegreeTwoThreeFiniteCertificateBatch063","plan":"ci/rg_degree_two_three_actual_wave2_batch063_plan.json"},{"endpoint":"Proofs.RadenkovicGutmanDegreeTwoThreeFiniteCertificateBatch076","plan":"ci/rg_degree_two_three_actual_wave2_batch076_plan.json"},{"endpoint":"Proofs.RadenkovicGutmanDegreeTwoThreeFiniteCertificateBatch077","plan":"ci/rg_degree_two_three_actual_wave2_batch077_plan.json"},{"endpoint":"Proofs.RadenkovicGutmanDegreeTwoThreeFiniteCertificateBatch078","plan":"ci/rg_degree_two_three_actual_wave2_batch078_plan.json"},{"endpoint":"Proofs.RadenkovicGutmanDegreeTwoThreeFiniteCertificateBatch079","plan":"ci/rg_degree_two_three_actual_wave2_batch079_plan.json"},{"endpoint":"Proofs.RadenkovicGutmanDegreeTwoThreeFiniteCertificateBatch080","plan":"ci/rg_degree_two_three_actual_wave2_batch080_plan.json"},{"endpoint":"Proofs.RadenkovicGutmanDegreeTwoThreeFiniteCertificateBatch082","plan":"ci/rg_degree_two_three_actual_wave2_batch082_plan.json"},{"endpoint":"Proofs.RadenkovicGutmanDegreeTwoThreeFiniteCertificateBatch083","plan":"ci/rg_degree_two_three_actual_wave2_batch083_plan.json"},{"endpoint":"Proofs.RadenkovicGutmanDegreeTwoThreeFiniteCertificateBatch084","plan":"ci/rg_degree_two_three_actual_wave2_batch084_plan.json"},{"endpoint":"Proofs.RadenkovicGutmanDegreeTwoThreeFiniteCertificateBatch085","plan":"ci/rg_degree_two_three_actual_wave2_batch085_plan.json"},{"endpoint":"Proofs.RadenkovicGutmanDegreeTwoThreeFiniteCertificateBatch086","plan":"ci/rg_degree_two_three_actual_wave2_batch086_plan.json"},{"endpoint":"Proofs.RadenkovicGutmanDegreeTwoThreeFiniteCertificateBatch087","plan":"ci/rg_degree_two_three_actual_wave2_batch087_plan.json"}]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install the project toolchain
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Materialize the exact dependency lock
        run: python3 -B ci/rg_dependencies.py
      - name: Fetch the required Mathlib cache
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess
          root = pathlib.Path('Proofs/RG_Lean_20261019')
          seen, external = set(), set()
          def visit(name):
              if name in seen:
                  return
              seen.add(name)
              source = (root / (name.replace('.', '/') + '.lean')).read_text()
              for dep in re.findall(r'^\s*import\s+([\w.]+)', source, re.M):
                  if dep.startswith('Proofs.'):
                      visit(dep)
                  else:
                      external.add(dep)
          visit('${{ matrix.endpoint }}')
          subprocess.run(['lake', 'exe', 'cache', 'get', *sorted(external)], check=True)
          PY
      - name: Restore exactly the prerequisites of this actual-tree batch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,subprocess
          for manifest in json.load(open('${{ matrix.plan }}')):
              subprocess.run(['python3','-B','ci/rg_restore_job_exports.py','--manifest',manifest,'--build-directory','Proofs/RG_Lean_20261019/build/extension'],check=True)
          PY
      - name: Check multiplicities and actual graph spectral comparison
        shell: bash
        run: |
          set -o pipefail
          python3 -B Proofs/RG_Lean_20261019/verify_extension.py --mathlib-project "$GITHUB_WORKSPACE" --endpoint ${{ matrix.endpoint }} --workers 1 --module-timeout 600 --resume | python3 -B ci/rg_compact_ci_output.py
      - name: Retain completed records and diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib,shutil
          root=pathlib.Path('Proofs/RG_Lean_20261019/build/extension')
          records=[json.loads(p.read_text()) for p in sorted(root.glob('Proofs.*.json'))]
          fresh=root.parent/'fresh_exports';fresh.mkdir(parents=True,exist_ok=True)
          (fresh/'diagnostics_records.json').write_text(json.dumps({'modules':records},separators=(',',':'))+'\n')
          if (root/'receipt.json').is_file():shutil.copyfile(root/'receipt.json',fresh/'receipt.json')
          print('RETAINED_RECORD_COUNTS '+json.dumps({'total':len(records),'fresh':sum(r['mode']=='FRESH_KERNEL_EXPORT' for r in records)}))
          for row in records:
              if row['mode']=='FRESH_KERNEL_EXPORT':
                  name=row['module'];rel=name.replace('.','/')+'.olean';dest=fresh/rel
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(root/rel,dest);shutil.copyfile(root/(name+'.json'),fresh/(name+'.json'))
          for log in root.glob('Proofs.*.log'):
              shutil.copyfile(log,fresh/log.name);print('MODULE_LOG_TAIL '+log.name+' '+log.read_text()[-18000:])
          PY
      - name: Retain new exports only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rg-degree-two-three-actual-wave2-exports-${{ github.run_id }}-${{ strategy.job-index }}
          path: Proofs/RG_Lean_20261019/build/fresh_exports
          retention-days: 7
