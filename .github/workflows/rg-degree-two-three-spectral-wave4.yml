manDegreeTwoThreeSpectraBatch113,Proofs.RadenkovicGutmanDegreeTwoThreeSpectraBatch114,Proofs.RadenkovicGutmanDegreeTwoThreeSpectraBatch115,Proofs.RadenkovicGutmanDegreeTwoThreeSpectraBatch116,Proofs.RadenkovicGutmanDegreeTwoThreeSpectraBatch117,Proofs.RadenkovicGutmanDegreeTwoThreeSpectraBatch118,Proofs.RadenkovicGutmanDegreeTwoThreeSpectraBatch119,Proofs.RadenkovicGutmanDegreeTwoThreeSpectraBatch120,Proofs.RadenkovicGutmanDegreeTwoThreeSpectraBatch121,Proofs.RadenkovicGutmanDegreeTwoThreeSpectraBatch122,Proofs.RadenkovicGutmanDegreeTwoThreeSpectraBatch123,Proofs.RadenkovicGutmanDegreeTwoThreeSpectraBatch124,Proofs.RadenkovicGutmanDegreeTwoThreeSpectraBatch125,Proofs.RadenkovicGutmanDegreeTwoThreeSpectraBatch126,Proofs.RadenkovicGutmanDegreeTwoThreeSpectraBatch127,Proofs.RadenkovicGutmanDegreeTwoThreeSpectraBatch128,Proofs.RadenkovicGutmanDegreeTwoThreeSpectraBatch129,Proofs.RadenkovicGutmanDegreeTwoThreeSpectraBatch130,Proofs.RadenkovicGutmanDegreeTwoThreeSpectraBatch131,Proofs.RadenkovicGutmanDegreeTwoThreeSpectraBatch132,Proofs.RadenkovicGutmanDegreeTwoThreeSpectraBatch133,Proofs.RadenkovicGutmanDegreeTwoThreeSpectraBatch134,Proofs.RadenkovicGutmanDegreeTwoThreeSpectraBatch135]
