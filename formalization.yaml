version: v0.4
project:
  name: "Graphical Stirling and Bell minima at fixed order and size"
  description: >-
    For every nonempty finite simple graph, the quasi-complete graph with the
    same numbers of vertices and edges has no more stable partitions into
    any prescribed number of nonempty independent unlabeled blocks.
    Summing these inequalities proves the corresponding graphical Bell
    minimum. The development covers disconnected graphs and makes no
    assertion of uniqueness of the minimizing isomorphism type.
  authors: ["J. J. Gebendorfer"]
  responsible_maintainers: ["J. J. Gebendorfer"]
  license: Apache-2.0
classification:
  arxiv: [math.CO]
  msc2020: [05C15, 05C35, 05A18]
