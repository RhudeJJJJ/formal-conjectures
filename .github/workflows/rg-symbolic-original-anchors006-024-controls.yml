name: RG symbolic original anchors006 024 controls

on:
  push:
    branches: [rg-remaining-six-spectral-20261021]
    paths: ['.github/workflows/rg-symbolic-original-anchors006-024-controls.yml']

permissions:
  contents: read
  actions: read

jobs:
  check:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        endpoint: [Proofs.RadenkovicGutmanSymbolicAnchor006Cell000,Proofs.RadenkovicGutmanSymbolicAnchor006Cell127,Proofs.RadenkovicGutmanSymbolicAnchor006Cell254,Proofs.RadenkovicGutmanSymbolicAnchor007Cell000,Proofs.RadenkovicGutmanSymbolicAnchor007Cell127,Proofs.RadenkovicGutmanSymbolicAnchor007Cell254,Proofs.RadenkovicGutmanSymbolicAnchor008Cell000,Proofs.RadenkovicGutmanSymbolicAnchor008Cell127,Proofs.RadenkovicGutmanSymbolicAnchor008Cell254,Proofs.RadenkovicGutmanSymbolicAnchor009Cell000,Proofs.RadenkovicGutmanSymbolicAnchor009Cell127,Proofs.RadenkovicGutmanSymbolicAnchor009Cell254,Proofs.RadenkovicGutmanSymbolicAnchor010Cell000,Proofs.RadenkovicGutmanSymbolicAnchor010Cell127,Proofs.RadenkovicGutmanSymbolicAnchor010Cell254,Proofs.RadenkovicGutmanSymbolicAnchor011Cell000,Proofs.RadenkovicGutmanSymbolicAnchor011Cell127,Proofs.RadenkovicGutmanSymbolicAnchor011Cell254,Proofs.RadenkovicGutmanSymbolicAnchor012Cell000,Proofs.RadenkovicGutmanSymbolicAnchor012Cell127,Proofs.RadenkovicGutmanSymbolicAnchor012Cell254,Proofs.RadenkovicGutmanSymbolicAnchor013Cell000,Proofs.RadenkovicGutmanSymbolicAnchor013Cell127,Proofs.RadenkovicGutmanSymbolicAnchor013Cell254,Proofs.RadenkovicGutmanSymbolicAnchor014Cell000,Proofs.RadenkovicGutmanSymbolicAnchor014Cell127,Proofs.RadenkovicGutmanSymbolicAnchor014Cell254,Proofs.RadenkovicGutmanSymbolicAnchor015Cell000,Proofs.RadenkovicGutmanSymbolicAnchor015Cell127,Proofs.RadenkovicGutmanSymbolicAnchor015Cell254,Proofs.RadenkovicGutmanSymbolicAnchor016Cell000,Proofs.RadenkovicGutmanSymbolicAnchor016Cell127,Proofs.RadenkovicGutmanSymbolicAnchor016Cell254,Proofs.RadenkovicGutmanSymbolicAnchor017Cell000,Proofs.RadenkovicGutmanSymbolicAnchor017Cell127,Proofs.RadenkovicGutmanSymbolicAnchor017Cell254,Proofs.RadenkovicGutmanSymbolicAnchor018Cell000,Proofs.RadenkovicGutmanSymbolicAnchor018Cell127,Proofs.RadenkovicGutmanSymbolicAnchor018Cell254,Proofs.RadenkovicGutmanSymbolicAnchor019Cell000,Proofs.RadenkovicGutmanSymbolicAnchor019Cell127,Proofs.RadenkovicGutmanSymbolicAnchor019Cell254,Proofs.RadenkovicGutmanSymbolicAnchor020Cell000,Proofs.RadenkovicGutmanSymbolicAnchor020Cell127,Proofs.RadenkovicGutmanSymbolicAnchor020Cell254,Proofs.RadenkovicGutmanSymbolicAnchor021Cell000,Proofs.RadenkovicGutmanSymbolicAnchor021Cell127,Proofs.RadenkovicGutmanSymbolicAnchor021Cell254,Proofs.RadenkovicGutmanSymbolicAnchor022Cell000,Proofs.RadenkovicGutmanSymbolicAnchor022Cell127,Proofs.RadenkovicGutmanSymbolicAnchor022Cell254,Proofs.RadenkovicGutmanSymbolicAnchor023Cell000,Proofs.RadenkovicGutmanSymbolicAnchor023Cell127,Proofs.RadenkovicGutmanSymbolicAnchor023Cell254,Proofs.RadenkovicGutmanSymbolicAnchor024Cell000,Proofs.RadenkovicGutmanSymbolicAnchor024Cell127,Proofs.RadenkovicGutmanSymbolicAnchor024Cell254]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install the project toolchain
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Materialize the exact dependency lock
        run: python3 -B ci/rg_dependencies.py
      - name: Fetch the required Mathlib cache
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess
          root = pathlib.Path('Proofs/RG_Lean_20261019')
          seen, external = set(), set()
          def visit(name):
              if name in seen:
                  return
              seen.add(name)
              source = (root / (name.replace('.', '/') + '.lean')).read_text()
              for dep in re.findall(r'^\s*import\s+([\w.]+)', source, re.M):
                  if dep.startswith('Proofs.'):
                      visit(dep)
                  elif not dep.startswith(('Lean.', 'Init.', 'Std.')) and dep not in ('Lean','Init','Std'):
                      external.add(dep)
          visit('${{ matrix.endpoint }}')
          subprocess.run(['lake', 'exe', 'cache', 'get', *sorted(external)], check=True)
          PY
      - name: Restore one independently audited complete source-bound base scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B ci/rg_restore_complete_scope.py --manifest ci/rg_reusable_analytic_kernel_base_complete_scope_capsule.json --build-directory Proofs/RG_Lean_20261019/build/extension
      - name: Restore independently audited exact control proofs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B ci/rg_restore_plan_parallel.py --plan ci/rg_symbolic_anchor005_control_prior_restore_plan.json --build-directory Proofs/RG_Lean_20261019/build/extension --workers 2
      - name: Bound the remaining fresh module frontier
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B ci/rg_restore_with_kernel_fallback.py --plan ci/rg_symbolic_anchor005_control_prior_restore_plan.json --build-directory Proofs/RG_Lean_20261019/build/extension --endpoint ${{ matrix.endpoint }} --max-fresh 2 --preflight-only
      - name: Check multiplicities and actual graph spectral comparison
        shell: bash
        run: |
          set -o pipefail
          python3 -B Proofs/RG_Lean_20261019/verify_extension.py --mathlib-project "$GITHUB_WORKSPACE" --endpoint ${{ matrix.endpoint }} --workers 1 --module-timeout 600 --resume | python3 -B ci/rg_compact_ci_output.py
      - name: Retain completed records and diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib,shutil
          root=pathlib.Path('Proofs/RG_Lean_20261019/build/extension')
          records=[json.loads(p.read_text()) for p in sorted(root.glob('Proofs.*.json'))]
          fresh=root.parent/'fresh_exports';fresh.mkdir(parents=True,exist_ok=True)
          (fresh/'diagnostics_records.json').write_text(json.dumps({'modules':records},separators=(',',':'))+'\n')
          if (root/'receipt.json').is_file():shutil.copyfile(root/'receipt.json',fresh/'receipt.json')
          print('RETAINED_RECORD_COUNTS '+json.dumps({'total':len(records),'fresh':sum(r['mode']=='FRESH_KERNEL_EXPORT' for r in records)}))
          for row in records:
              if row['mode']=='FRESH_KERNEL_EXPORT':
                  name=row['module'];rel=name.replace('.','/')+'.olean';dest=fresh/rel
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(root/rel,dest);shutil.copyfile(root/(name+'.json'),fresh/(name+'.json'))
          for log in root.glob('Proofs.*.log'):
              shutil.copyfile(log,fresh/log.name);print('MODULE_LOG_TAIL '+log.name+' '+log.read_text()[-18000:])
          PY
      - name: Retain new exports only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rg-symbolic-original-anchors006-024-controls-exports-${{ github.run_id }}-${{ strategy.job-index }}
          path: Proofs/RG_Lean_20261019/build/fresh_exports
          retention-days: 7
