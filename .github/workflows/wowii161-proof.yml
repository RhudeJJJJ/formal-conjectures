name: WOWII161 exact Lean certificate development
on:
  push:
    branches: [proof-wowii161-20261103]
    paths: [".github/workflows/wowii161-proof.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  certificate:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pinned Lean
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Get pinned Mathlib cache
        run: lake exe cache get
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .lake/build
          key: wowii161-imports-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            wowii161-imports-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            spectral-chromatic-imports-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Build exact statement modules
        run: lake --wfail build FormalConjectures.WrittenOnTheWallII.GraphConjecture161 FormalConjectures.WrittenOnTheWallII.GraphConjecture372
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .lake/build
          key: wowii161-imports-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
      - name: Bounded exact-source certificate check
        env:
          PROOF_LOG_TOKEN: ${{ github.token }}
        run: |
          cp Proofs/WOWII161/ci_loop.py /tmp/wowii161-ci-loop.py
          python3 /tmp/wowii161-ci-loop.py

