name: RG exact compact closed original families

on:
  push:
    branches: [rg-degree-one-large-20261103]
    paths: ['.github/workflows/rg-compact-closed-family-join-20261103.yml']
  workflow_dispatch:
    inputs:
      execute_kernel:
        description: Authenticate objects and run the sealed kernel closure after successful planning
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  check:
    if: github.repository == 'RhudeJJJJ/formal-conjectures'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - family: degree_one_small
            endpoint: Proofs.RadenkovicGutmanCompactFiniteOriginalDegreeOneSmall
            fresh_bound: 2
          - family: small_ge_four
            endpoint: Proofs.RadenkovicGutmanCompactFiniteOriginalSmallGeFour
            fresh_bound: 1
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Reserve actual host space without touching proof inputs
        run: python3 -B ci/rg_prepare_finite_runner_storage.py --required-free-gib 45
      - name: Establish exact current closure and available original object coverage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -B ci/rg_plan_compact_closed_family.py \
            --family ${{ matrix.family }} \
            --output Proofs/RG_Lean_20261019/build/compact_closed_family_plan.json
      - name: Install the fixed project toolchain
        if: github.event_name != 'workflow_dispatch' || inputs.execute_kernel
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Materialize the fixed dependency lock
        if: github.event_name != 'workflow_dispatch' || inputs.execute_kernel
        run: python3 -B ci/rg_dependencies.py
      - name: Fetch only the external modules of this exact source closure
        if: github.event_name != 'workflow_dispatch' || inputs.execute_kernel
        run: |
          python3 - <<'PY'
          import json, pathlib, re, subprocess, sys
          root = pathlib.Path('Proofs/RG_Lean_20261019')
          sys.path.insert(0, str(root))
          from verify import without_comments
          plan = json.loads((root / 'build/compact_closed_family_plan.json').read_bytes())
          external = set()
          for name in plan['source_sha256']:
              base = root / 'ThirdParty/LeanCert' if name.startswith('LeanCert.') else root
              text = without_comments((base / (name.replace('.', '/') + '.lean')).read_text())
              for dep in re.findall(r'^\s*(?:public\s+)?import\s+([\w.]+)\s*$', text, re.M):
                  if not dep.startswith(('Proofs.', 'LeanCert.', 'Lean.', 'Init.', 'Std.')) and dep not in ('Lean', 'Init', 'Std'):
                      external.add(dep)
          subprocess.run(['lake', 'exe', 'cache', 'get', *sorted(external)], check=True)
          PY
      - name: Install the transparent filesystem utility
        if: github.event_name != 'workflow_dispatch' || inputs.execute_kernel
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y btrfs-progs
      - name: Create a new bounded logical proofstore without formatting an existing disk
        if: github.event_name != 'workflow_dispatch' || inputs.execute_kernel
        run: python3 -B ci/rg_ephemeral_compressed_proofstore.py --logical-gib 128
      - name: Authenticate and read back every selected original object and sidecar
        if: github.event_name != 'workflow_dispatch' || inputs.execute_kernel
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -B ci/rg_restore_exact_compressed_plan.py \
            --plan Proofs/RG_Lean_20261019/build/compact_closed_family_plan.json \
            --build-directory Proofs/RG_Lean_20261019/build/extension
      - name: Recompute and enforce the sealed family fresh frontier
        if: github.event_name != 'workflow_dispatch' || inputs.execute_kernel
        run: |
          python3 -B ci/rg_restore_with_kernel_fallback.py \
            --plan ci/rg_empty_restore_plan.json \
            --build-directory Proofs/RG_Lean_20261019/build/extension \
            --endpoint ${{ matrix.endpoint }} \
            --max-fresh ${{ matrix.fresh_bound }} --preflight-only
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('Proofs/RG_Lean_20261019/build')
          planned = json.loads((root / 'compact_closed_family_plan.json').read_bytes())
          actual = json.loads((root / 'extension/bounded_kernel_fallback_plan.json').read_bytes())
          assert set(actual['fresh_modules']) == set(planned['fresh_modules'])
          assert actual['required_modules'] == planned['required_modules']
          assert set(actual['fresh_modules']) == set(planned['fresh_allowlist'])
          PY
      - name: Check the complete unchanged original closed family
        if: github.event_name != 'workflow_dispatch' || inputs.execute_kernel
        shell: bash
        run: |
          set -o pipefail
          python3 -B ci/rg_run_with_host_reserve.py -- \
            python3 -B ci/rg_observed_kernel_verify.py --memory-reserve-mib 2048 -- \
            --mathlib-project "$GITHUB_WORKSPACE" \
            --endpoint ${{ matrix.endpoint }} \
            --workers 1 --module-timeout 900 --resume | python3 -B ci/rg_compact_ci_output.py
      - name: Verify the exact closed-family scope and fresh module set
        if: github.event_name != 'workflow_dispatch' || inputs.execute_kernel
        run: python3 -B ci/rg_plan_compact_closed_family.py --family ${{ matrix.family }} --phase check --output Proofs/RG_Lean_20261019/build/compact_closed_family_plan.json --build-directory Proofs/RG_Lean_20261019/build/extension
      - name: Retain complete fresh outputs, axiom profiles, and diagnostics
        if: always()
        run: |
          python3 -B ci/rg_collect_fresh_exports.py \
            --build-directory Proofs/RG_Lean_20261019/build/extension \
            --output-directory Proofs/RG_Lean_20261019/build/fresh_exports
      - name: Preserve complete fresh proof exports in the standard archive layout
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rg-compact-closed-family-${{ matrix.family }}-${{ github.run_id }}
          path: Proofs/RG_Lean_20261019/build/fresh_exports
          retention-days: 90
      - name: Preserve original evidence and measured resource results separately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rg-compact-closed-family-evidence-${{ matrix.family }}-${{ github.run_id }}
          path: |
            Proofs/RG_Lean_20261019/build/compact_closed_family_plan.json
            Proofs/RG_Lean_20261019/build/extension/bounded_kernel_fallback_plan.json
            rg-proofstore-setup.json
            rg-proofstore-roundtrip-reports
            rg-proofstore-kernel-reserve.json
          retention-days: 90

