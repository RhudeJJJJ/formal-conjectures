  notes: >-
    The earlier Lean4.33.1 certificate had rigid-universe target comparisons
    and standard-axiom audits in public run40201620527. This new snapshot
    requires its own complete Palomar mechanical preflight and subsequent
    registry verification. No independent human expert review is claimed.
fidelity:
  notes: >-
    The compared statements retain n>=1, all finite vertex types, all block
    counts and explicit decidability instances. Stable partitions are actual
    partitions into nonempty independent unlabeled blocks. The stronger
    coefficientwise inequality concerns this basis, not ordinary monomial
    coefficients. No connectedness or extremal uniqueness conclusion is made.
