name: Total domination annihilation proof development
on:
  push:
    branches: [tda-full-proof-20261019]
  workflow_dispatch:
concurrency:
  group: tda-full-proof-20261019
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pinned Lean
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Get pinned Mathlib cache
        run: lake exe cache get
      - name: Restore exact statement imports
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .lake/build
          key: tda-imports-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            tda-imports-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            round8-imports-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
            round7-imports-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-
      - name: Compile exact target statement
        run: lake --wfail build FormalConjectures.Paper.TotalDominationAnnihilation
      - name: Save statement imports
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .lake/build
          key: tda-imports-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
      - name: Kernel check degree budget
        run: lake env lean -DwarningAsError=true Proofs/TDABudget.lean
      - name: Recheck credited Brooks theorem
        run: lake env lean -DwarningAsError=true Proofs/ZajacBrooks.lean
