name: RG remaining original middle anchor candidate searches 2

on:
  push:
    branches: [rg-remaining-six-spectral-20261021]
    paths: ['.github/workflows/rg-original-middle-remaining-candidates-2.yml']

permissions:
  contents: read

jobs:
  search:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        anchor: [465,466,467,468,469,470,471,472,473,474,475,476,477,478,479,480,481,482,483,484,485,486,487,488,489,490,491,492,493,494,495,496,497,498,499,500,501,502,503,504,505,506,507,508,509,510,511,512,513,514,515,516,517,518,519,520,521,522,523,524,525,526,527,528,529,530,531,532,533,534,535,536,537,538,539,540,541,542,543,544,545,546,547,548,549,550,551,552,553,554,555,556,557,558,559,560,561,562,563,564,565,566,567,568,569,570,571,572,573,574,575,576,577,578,579,580,581,582,583,584,585,586,587,588,589,590,591,592,593,594,595,596,597,598,599,600,601,602,603,604,605,606,607,608,609,610,611,612,613,614,615,616,617,618,619,620,621,622,623,624,625,626,627,628,629,630,631,632,633,634,635,636,637,638,639,640,641,642,643,644,645,646,647,648,649,650,651,652,653,654,655,656,657,658,659,660,661,662,663,664,665,666,667,668,669,670,671,672,673,674,675,676,677,678,679]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check the corrected exact candidate producer and unchanged original anchor source
        run: |
          python3 -B - <<'PY'
          import hashlib,json,pathlib
          m=json.loads(pathlib.Path('ci/rg_anchor_candidate_reference_manifest.json').read_bytes())
          for row in m['sources']:
              assert hashlib.sha256(pathlib.Path(row['file']).read_bytes()).hexdigest()==row['sha256'],row['file']
          PY
      - name: Generate bounded exact candidates for the same original target
        run: python3 -B ci/rg_anchor_candidate_reference/prepare_rg_compact_anchor_candidates.py --anchor-index ${{ matrix.anchor }} --max-seconds 900 --max-cells 2048
      - name: Retain exact witnesses, checkpoints and original target provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rg-original-middle-remaining-candidates-2-${{ github.run_id }}-${{ matrix.anchor }}
          path: work/rg_anchor_candidates
          retention-days: 90
