name: RG twelve original degree-one supporting classes
on:
  push:
    branches: [rg-degree-one-large-20261103]
    paths: ['.github/workflows/rg-d1-closed-classes-reconstruction-20261103.yml']
permissions:
  contents: read
  actions: read
jobs:
  check:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: D1Short33
            endpoint: Proofs.RadenkovicGutmanD1Short33
            fresh_count: 45
            spec: ci/rg_d1_20261103_closed_class_specs/D1Short33.json
          - name: D1FastFullBox40
            endpoint: Proofs.RadenkovicGutmanD1FastFullBox40
            fresh_count: 11
            spec: ci/rg_d1_20261103_closed_class_specs/D1FastFullBox40.json
          - name: D1FastFullBox20
            endpoint: Proofs.RadenkovicGutmanD1FastFullBox20
            fresh_count: 11
            spec: ci/rg_d1_20261103_closed_class_specs/D1FastFullBox20.json
          - name: D1Short13
            endpoint: Proofs.RadenkovicGutmanD1Short13
            fresh_count: 23
            spec: ci/rg_d1_20261103_closed_class_specs/D1Short13.json
          - name: D1Short44
            endpoint: Proofs.RadenkovicGutmanD1Short44
            fresh_count: 10
            spec: ci/rg_d1_20261103_closed_class_specs/D1Short44.json
          - name: FirstClassNormalized
            endpoint: Proofs.RadenkovicGutmanFirstClassNormalized
            fresh_count: 20
            spec: ci/rg_d1_20261103_closed_class_specs/FirstClassNormalized.json
          - name: D1Short34
            endpoint: Proofs.RadenkovicGutmanD1Short34
            fresh_count: 10
            spec: ci/rg_d1_20261103_closed_class_specs/D1Short34.json
          - name: D1Short24
            endpoint: Proofs.RadenkovicGutmanD1Short24
            fresh_count: 10
            spec: ci/rg_d1_20261103_closed_class_specs/D1Short24.json
          - name: D1Short23
            endpoint: Proofs.RadenkovicGutmanD1Short23
            fresh_count: 10
            spec: ci/rg_d1_20261103_closed_class_specs/D1Short23.json
          - name: D1Short14
            endpoint: Proofs.RadenkovicGutmanD1Short14
            fresh_count: 10
            spec: ci/rg_d1_20261103_closed_class_specs/D1Short14.json
          - name: D1Short22
            endpoint: Proofs.RadenkovicGutmanD1Short22
            fresh_count: 10
            spec: ci/rg_d1_20261103_closed_class_specs/D1Short22.json
          - name: D1Short12
            endpoint: Proofs.RadenkovicGutmanD1Short12
            fresh_count: 10
            spec: ci/rg_d1_20261103_closed_class_specs/D1Short12.json
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install the project toolchain
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Materialize the exact dependency lock
        run: python3 -B ci/rg_dependencies.py
      - name: Fetch the required Mathlib cache
        run: |
          python3 - <<'PY'
          import pathlib,re,subprocess
          root=pathlib.Path('Proofs/RG_Lean_20261019')
          seen,external=set(),set()
          def visit(name):
              if name in seen:return
              seen.add(name)
              source=(root/(name.replace('.','/')+'.lean')).read_text()
              for dep in re.findall(r'^\s*import\s+([\w.]+)',source,re.M):
                  if dep.startswith('Proofs.'):visit(dep)
                  elif not dep.startswith(('Lean.','Init.','Std.')) and dep not in ('Lean','Init','Std'):external.add(dep)
          visit('${{ matrix.endpoint }}')
          subprocess.run(['lake','exe','cache','get',*sorted(external)],check=True)
          PY
      - name: Restore the available independently audited base
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib
          spec=json.loads(pathlib.Path('${{ matrix.spec }}').read_text())
          assert spec['base_manifest']=='ci/rg_reusable_analytic_kernel_base_complete_scope_capsule.json'
          assert hashlib.sha256(pathlib.Path(spec['base_manifest']).read_bytes()).hexdigest()==spec['base_manifest_sha256']
          PY
          python3 -B ci/rg_restore_complete_scope.py --manifest ci/rg_reusable_analytic_kernel_base_complete_scope_capsule.json --build-directory Proofs/RG_Lean_20261019/build/extension
      - name: Bind every fresh module to its original source and closure
        run: |
          python3 -B ci/rg_restore_with_kernel_fallback.py --plan ci/rg_empty_restore_plan.json --build-directory Proofs/RG_Lean_20261019/build/extension --endpoint ${{ matrix.endpoint }} --max-fresh ${{ matrix.fresh_count }} --preflight-only
          python3 -B ci/rg_assert_source_bound_fresh_frontier.py --spec ${{ matrix.spec }} --build-directory Proofs/RG_Lean_20261019/build/extension
          mkdir -p Proofs/RG_Lean_20261019/build/fresh_exports
          cp Proofs/RG_Lean_20261019/build/extension/bounded_kernel_fallback_plan.json Proofs/RG_Lean_20261019/build/fresh_exports/closed_class_frontier.json
      - name: Reconstruct the original class with the strict kernel verifier
        shell: bash
        run: |
          set -o pipefail
          python3 -B ci/rg_observed_kernel_verify.py --memory-reserve-mib 2048 -- --mathlib-project "$GITHUB_WORKSPACE" --endpoint ${{ matrix.endpoint }} --workers 1 --module-timeout 600 --resume | python3 -B ci/rg_compact_ci_output.py
      - name: Require the original object, member and axiom identities
        shell: bash
        run: |
          set -o pipefail
          python3 -B ci/rg_assert_source_bound_fresh_frontier.py --spec ${{ matrix.spec }} --build-directory Proofs/RG_Lean_20261019/build/extension --phase after | tee Proofs/RG_Lean_20261019/build/fresh_exports/closed_class_identity_check.json
      - name: Retain completed records, complete module outputs and diagnostics
        if: always()
        run: python3 -B ci/rg_collect_fresh_exports.py --build-directory Proofs/RG_Lean_20261019/build/extension --output-directory Proofs/RG_Lean_20261019/build/fresh_exports
      - name: Retain original class reconstruction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rg-d1-closed-classes-20261103-${{ github.run_id }}-${{ matrix.name }}
          path: Proofs/RG_Lean_20261019/build/fresh_exports
          retention-days: 90
