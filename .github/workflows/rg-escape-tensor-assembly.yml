name: RG full original tensors with explicit prior-job provenance

on:
  push:
    branches: [rg-escape-tensor-assembly-20261021]
    paths:
      - 'Proofs/RG_Lean_20261019/**'
      - '.github/workflows/rg-escape-tensor-assembly.yml'

permissions:
  contents: read
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install the project toolchain
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Materialize the exact dependency lock
        run: python3 -B ci/rg_dependencies.py
      - name: Fetch the required Mathlib cache
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess
          root = pathlib.Path('Proofs/RG_Lean_20261019')
          seen, external = set(), set()
          def visit(name):
              if name in seen:
                  return
              seen.add(name)
              source = (root / (name.replace('.', '/') + '.lean')).read_text()
              for dep in re.findall(r'^\s*import\s+([\w.]+)', source, re.M):
                  if dep.startswith('Proofs.'):
                      visit(dep)
                  else:
                      external.add(dep)
          visit('Proofs.RadenkovicGutmanEscapeTensorAcceptance')
          subprocess.run(['lake', 'exe', 'cache', 'get', *sorted(external)], check=True)
          PY
      - name: Restore exact prior job exports and their original provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -B ci/rg_restore_job_exports.py --manifest ci/rg_escape_prior_exports.json --build-directory Proofs/RG_Lean_20261019/build/extension
          python3 -B ci/rg_restore_job_exports.py --manifest ci/rg_prior_escape_remaining_row40.json --build-directory Proofs/RG_Lean_20261019/build/extension
          python3 -B ci/rg_restore_job_exports.py --manifest ci/rg_prior_escape_remaining_row41.json --build-directory Proofs/RG_Lean_20261019/build/extension
          python3 -B ci/rg_restore_job_exports.py --manifest ci/rg_prior_escape_remaining_row42.json --build-directory Proofs/RG_Lean_20261019/build/extension
          python3 -B ci/rg_restore_job_exports.py --manifest ci/rg_prior_escape_remaining_row43.json --build-directory Proofs/RG_Lean_20261019/build/extension
          python3 -B ci/rg_restore_job_exports.py --manifest ci/rg_prior_escape_remaining_row44.json --build-directory Proofs/RG_Lean_20261019/build/extension
      - name: Check original complete tensor and actual graph assembly
        run: |
          python3 -B Proofs/RG_Lean_20261019/verify_extension.py \
            --mathlib-project "$GITHUB_WORKSPACE" \
            --endpoint Proofs.RadenkovicGutmanEscapeTensorAcceptance \
            --workers 1 --module-timeout 900 --resume --print-receipt
      - name: Retain completed records and diagnostic log tails
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib
          root=pathlib.Path('Proofs/RG_Lean_20261019/build/extension')
          records=[json.loads(p.read_text()) for p in sorted(root.glob('Proofs.*.json'))]
          print('PARTIAL_RECORDS_JSON '+json.dumps({'scope':'INDIVIDUAL_COMPLETED_MODULES; not a complete extension receipt','modules':records},separators=(',',':')))
          for p in sorted(root.glob('Proofs.*Escape*.log')):
              t=p.read_text(); print('MODULE_LOG_TAIL '+p.name+' '+t[-16000:])
          PY
      - name: Retain local exports and kernel logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rg-exports-${{ github.run_id }}
          path: Proofs/RG_Lean_20261019/build/extension
          retention-days: 7
