name: RG stop exactly four invalid degree3 source preparation runs
on:
  push:
    branches: [rg-remaining-six-spectral-20261021]
    paths: ['.github/workflows/rg-stop-four-invalid-d3-source-runs.yml']
permissions:
  contents: read
  actions: write
jobs:
  stop-invalid-source-runs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel only the four original runs missing a fixed source input
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -B - <<'PY'
          import json,os,urllib.request
          repository='RhudeJJJJ/formal-conjectures'
          assert os.environ['GITHUB_REPOSITORY']==repository
          targets={40165172450:0,40165172200:1,40165172387:2,40165172192:3}
          source='aca9f0003c15181b58cf68bd607f286e0300f35a'
          headers={'Authorization':'Bearer '+os.environ['GITHUB_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2026-03-10'}
          for run,part in targets.items():
              url=f'https://api.github.com/repos/{repository}/actions/runs/{run}'
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as response:
                  record=json.load(response)
              assert record['id']==run and record['repository']['full_name']==repository
              assert record['head_sha']==source and record['event']=='push'
              assert record['head_branch']=='rg-remaining-six-spectral-20261021'
              assert record['path']==f'.github/workflows/rg-d3-remaining-original-refined-squares-part{part}.yml'
              assert record['run_attempt']==1
              if record['status']=='completed':
                  print(json.dumps(dict(run=run,status='ALREADY_COMPLETED_UNCHANGED',conclusion=record['conclusion'])),flush=True)
                  continue
              request=urllib.request.Request(url+'/cancel',headers=headers,method='POST')
              with urllib.request.urlopen(request,timeout=30) as response:
                  assert response.status==202
              print(json.dumps(dict(run=run,status='CANCELLATION_ACCEPTED',source=source,logs_and_artifacts_not_deleted=True)),flush=True)
          PY
