name: RG d3 class30 parameter cover bulk

on:
  push:
    branches: [rg-remaining-six-spectral-20261021]
    paths: ['.github/workflows/rg-d3-class30-parameter-cover-bulk.yml']

permissions:
  contents: read
  actions: read

jobs:
  check:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        endpoint: [Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch000,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch001,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch002,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch003,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch004,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch005,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch006,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch007,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch008,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch009,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch010,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch011,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch012,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch013,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch014,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch015,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch016,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch017,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch018,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch019,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch020,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch021,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch022,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch023,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch024,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch025,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch026,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch027,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch028,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch029,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch030,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch031,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch032,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch033,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch034,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch035,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch036,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch037,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch038,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch039,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch040,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch041,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch042,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch043,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch044,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch045,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch046,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch047,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch048,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch049,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch050,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch051,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch052,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch053,Proofs.RadenkovicGutmanFixedDegree03Class30ParameterDepth1Batch054]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install the project toolchain
        run: |
          set -o pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/download/v1.4.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Materialize the exact dependency lock
        run: python3 -B ci/rg_dependencies.py
      - name: Fetch the required Mathlib cache
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess
          root = pathlib.Path('Proofs/RG_Lean_20261019')
          seen, external = set(), set()
          def visit(name):
              if name in seen:
                  return
              seen.add(name)
              source = (root / (name.replace('.', '/') + '.lean')).read_text()
              for dep in re.findall(r'^\s*import\s+([\w.]+)', source, re.M):
                  if dep.startswith('Proofs.'):
                      visit(dep)
                  elif not dep.startswith(('Lean.', 'Init.', 'Std.')) and dep not in ('Lean','Init','Std'):
                      external.add(dep)
          visit('${{ matrix.endpoint }}')
          subprocess.run(['lake', 'exe', 'cache', 'get', *sorted(external)], check=True)
          PY
      - name: Restore one independently audited complete source-bound base scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B ci/rg_restore_complete_scope.py --manifest ci/rg_reusable_analytic_kernel_base_complete_scope_capsule.json --build-directory Proofs/RG_Lean_20261019/build/extension
      - name: Restore independently audited exact control proofs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B ci/rg_restore_plan_parallel.py --plan ci/rg_d3_class30_parameter_cover_control_restore_plan.json --build-directory Proofs/RG_Lean_20261019/build/extension --workers 2
      - name: Bound the remaining fresh module frontier
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -B ci/rg_restore_with_kernel_fallback.py --plan ci/rg_d3_class30_parameter_cover_control_restore_plan.json --build-directory Proofs/RG_Lean_20261019/build/extension --endpoint ${{ matrix.endpoint }} --max-fresh 31 --preflight-only
      - name: Check multiplicities and actual graph spectral comparison
        shell: bash
        run: |
          set -o pipefail
          python3 -B Proofs/RG_Lean_20261019/verify_extension.py --mathlib-project "$GITHUB_WORKSPACE" --endpoint ${{ matrix.endpoint }} --workers 1 --module-timeout 600 --resume | python3 -B ci/rg_compact_ci_output.py
      - name: Retain completed records and diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import json,pathlib,shutil
          root=pathlib.Path('Proofs/RG_Lean_20261019/build/extension')
          records=[json.loads(p.read_text()) for p in sorted(root.glob('Proofs.*.json'))]
          fresh=root.parent/'fresh_exports';fresh.mkdir(parents=True,exist_ok=True)
          (fresh/'diagnostics_records.json').write_text(json.dumps({'modules':records},separators=(',',':'))+'\n')
          if (root/'receipt.json').is_file():shutil.copyfile(root/'receipt.json',fresh/'receipt.json')
          print('RETAINED_RECORD_COUNTS '+json.dumps({'total':len(records),'fresh':sum(r['mode']=='FRESH_KERNEL_EXPORT' for r in records)}))
          for row in records:
              if row['mode']=='FRESH_KERNEL_EXPORT':
                  name=row['module'];rel=name.replace('.','/')+'.olean';dest=fresh/rel
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(root/rel,dest);shutil.copyfile(root/(name+'.json'),fresh/(name+'.json'))
          for log in root.glob('Proofs.*.log'):
              shutil.copyfile(log,fresh/log.name);print('MODULE_LOG_TAIL '+log.name+' '+log.read_text()[-18000:])
          PY
      - name: Retain new exports only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rg-d3-class30-parameter-cover-bulk-exports-${{ github.run_id }}-${{ strategy.job-index }}
          path: Proofs/RG_Lean_20261019/build/fresh_exports
          retention-days: 7
